openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: artwork
    description: AI Artwork Pipeline operations
  - name: community
    description: Authenticated SummitReady member sharing
paths:
  /local-hills/source:
    get:
      operationId: getLocalHillSource
      tags: [hills]
      summary: Download the OpenStreetMap-derived UK hill database under ODbL
      responses:
        "200":
          description: The full source snapshot, with licensing, provenance and named peak records; no private user or canonical third-party data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalHillSourceSnapshot"
        "503":
          description: No validated source snapshot is currently available
  /membership/access:
    get:
      operationId: getMembershipAccess
      tags: [membership]
      parameters:
        - { in: query, name: refresh, schema: { type: boolean } }
      responses:
        "200":
          description: Server-verified access for the authenticated Clerk owner
          content:
            application/json:
              schema:
                type: object
                required: [tier, fullExpeditions, training, legacy, starterExpeditionId]
                properties:
                  tier: { type: string, enum: [explore, expeditions, pro] }
                  fullExpeditions: { type: boolean }
                  training: { type: boolean }
                  legacy: { type: boolean }
                  starterExpeditionId: { type: [string, "null"] }
        "401": { description: Authentication required }
        "503": { description: Verification unavailable; not a downgrade }
  /membership/authorize:
    post:
      operationId: authorizeMembershipAction
      tags: [membership]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipActionInput"
      responses:
        "200":
          description: Action authorized by verified entitlements
          content:
            application/json:
              schema:
                type: object
                required: [allowed, tier]
                properties:
                  allowed: { type: boolean }
                  tier: { type: string, enum: [explore, expeditions, pro] }
        "400": { description: Invalid action identity }
        "401": { description: Authentication required }
        "403": { description: Paid access required }
        "503": { description: Verification temporarily unavailable }
  /admin/route-reviews:
    get:
      operationId: listRouteReviews
      tags: [RouteReviews]
      responses:
        "200":
          description: Development candidates, never public routes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteReviewEnvelope" }
  /admin/route-reviews/preview:
    post:
      operationId: previewRouteReview
      tags: [RouteReviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteCandidateInput" }
      responses:
        "200":
          description: Preview only, no writes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteReviewPreview" }
  /admin/route-reviews/import:
    post:
      operationId: importRouteReview
      tags: [RouteReviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteCandidateInput" }
      responses:
        "201":
          description: Immutable quarantined candidate saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteReviewCreated" }
  /admin/route-reviews/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getRouteReview
      tags: [RouteReviews]
      responses:
        "200":
          description: Exact revision and append-only review history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteReviewEnvelope" }
  /admin/route-reviews/{id}/validate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: validateRouteReview
      tags: [RouteReviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteReviewValidationInput" }
      responses:
        "201":
          description: Validation appended; accepted requires exact binding and human review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteReviewCreated" }
  /admin/route-reviews/{id}/decision:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decideRouteReview
      tags: [RouteReviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteReviewDecisionInput" }
      responses:
        "201":
          description: Development decision appended; stale head returns 409
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteReviewCreated" }
  /admin/route-reviews/{id}/files/{name}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: name, in: path, required: true, schema: { type: string, enum: [geometry, profile, terrain-manifest, source-snapshot, terrain-rights] } }
    get:
      operationId: downloadRouteReviewFile
      tags: [RouteReviews]
      responses:
        "200":
          description: Admin-only integrity-checked original JSON evidence
          content:
            application/json:
              schema: { type: string }
  /admin/expeditions:
    get:
      operationId: listAdminExpeditions
      description: Admin key required. Includes drafts and hidden expeditions.
      responses:
        "200":
          description: Expedition library
          content:
            application/json:
              schema:
                type: object
                required: [expeditions]
                properties:
                  expeditions: { type: array, items: { $ref: "#/components/schemas/AdminExpeditionRecord" } }
        "401": { description: Admin key required }
  /admin/expeditions/catalogue:
    get:
      operationId: searchExpeditionCatalogue
      description: Admin key required. Trusted summit identity only, not route verification.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
      responses:
        "200":
          description: Matching catalogue summits
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ExpeditionCatalogueMountain" } }
                  hasMore: { type: boolean }
        "401": { description: Admin key required }
        "503": { description: Catalogue unavailable }
  /admin/expeditions/artwork-library:
    get:
      operationId: getExpeditionArtworkLibrary
      tags: [artwork]
      responses:
        "200":
          description: Approved Signature artwork available for explicit reuse
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [challengeId, challengeName, targetMountainName, imageVersion, heroUrl, cardUrl, thumbnailUrl]
                      properties:
                        challengeId: { type: string }
                        challengeName: { type: string }
                        targetMountainName: { type: string }
                        imageVersion: { type: integer }
                        heroUrl: { type: string }
                        cardUrl: { type: string }
                        thumbnailUrl: { type: string }
        "401": { description: Admin key required }
  /admin/expeditions/{id}/artwork:
    post:
      operationId: assignExpeditionArtwork
      tags: [artwork]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpeditionArtworkAssignment" }
      responses:
        "200":
          description: Approved artwork copied to this expedition without changing availability
          content:
            application/json:
              schema:
                type: object
                required: [assigned, sourceChallengeId, sourceImageVersion, imageVersion]
                properties:
                  assigned: { type: boolean }
                  sourceChallengeId: { type: string }
                  sourceImageVersion: { type: integer }
                  imageVersion: { type: integer }
        "400": { description: Invalid selection }
        "401": { description: Admin key required }
        "404": { description: Expedition or source missing }
        "409": { description: Artwork or expedition changed; refresh and review again }
        "503": { description: Artwork unavailable; existing assignment preserved }
  /admin/expeditions/target-profile:
    post:
      operationId: getAdminExpeditionTargetProfile
      tags: [artwork]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VirtualExpeditionSearchInput" }
      responses:
        "200":
          description: Same target route profile as the app; no local route discovery
          content:
            application/json:
              schema:
                type: object
                required: [targetProfile]
                properties:
                  targetProfile:
                    type: object
                    required: [name, totalElevationGain, totalDistance]
                    properties:
                      name: { type: string }
                      totalElevationGain: { type: number }
                      totalDistance: { type: number }
                      technicalGrade: { type: string }
                  targetRoute:
                    type: object
                    properties:
                      identityKey: { type: ["string", "null"] }
                      name: { type: ["string", "null"] }
                  provenance:
                    type: object
                    additionalProperties: true
                    properties:
                      targetRouteSource: { type: string }
                      warnings: { type: array, items: { type: string } }
        "400": { description: Invalid target }
        "401": { description: Admin key required }
        "409":
          description: Explicit mountain or route selection required
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "429": { description: Another admin calculation is in progress }
  /admin/expeditions/generate:
    post:
      operationId: generateAdminExpedition
      description: Admin-only preview using the app expedition engine. Does not save or approve content.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VirtualExpeditionSearchInput" }
      responses:
        "200":
          description: Editable unsaved draft and evidence warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExpeditionGenerationPreview" }
        "400": { description: Invalid generation inputs }
        "401": { description: Admin key required }
        "409":
          description: Select the exact target mountain or route and retry
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "429": { description: Another admin generation is already running }
        "500": { description: Expedition engine unavailable }
  /admin/expeditions/preview:
    post:
      operationId: previewExpeditionImport
      description: Admin key required. Read-only validation, never writes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpeditionImportBatch" }
      responses:
        "200":
          description: Validation results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpeditionImportPreview" }
        "401": { description: Admin key required }
  /admin/expeditions/import:
    post:
      operationId: importExpeditionDrafts
      description: Admin key required. Atomic create-only import; drafts only, never overwrites.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpeditionImportBatch" }
      responses:
        "201":
          description: Draft IDs created
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created: { type: array, items: { type: string } }
        "400": { description: "Validation failed, nothing saved" }
        "401": { description: Admin key required }
        "409": { description: "Duplicate ID, nothing saved" }
  /admin/expeditions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAdminExpedition
      description: Admin key required.
      responses:
        "200":
          description: Expedition with stages and limitations
          content:
            application/json:
              schema:
                type: object
                required: [expedition]
                properties:
                  expedition: { $ref: "#/components/schemas/AdminExpeditionRecord" }
        "401": { description: Admin key required }
        "404": { description: Not found }
    put:
      operationId: updateAdminExpedition
      description: Admin key required. Optimistic concurrency; active status requires human review confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpeditionUpdateRequest" }
      responses:
        "200":
          description: Saved expedition
          content:
            application/json:
              schema:
                type: object
                required: [expedition]
                properties:
                  expedition: { $ref: "#/components/schemas/AdminExpeditionRecord" }
        "400": { description: Validation failed }
        "401": { description: Admin key required }
        "409": { description: "Stale editor, reload required" }
    delete:
      operationId: deleteAdminExpeditionDraft
      description: Admin key required. Only unchanged drafts may be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpeditionDeleteRequest" }
      responses:
        "200":
          description: Draft deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        "401": { description: Admin key required }
        "409": { description: Not a draft or stale version }
  /weather/forecast:
    get:
      operationId: getMountainWeather
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Location forecast, not a verified summit forecast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MountainWeather" }
        "400": { description: Invalid coordinates }
        "429": { description: Request limit reached }
        "503": { description: Forecast temporarily unavailable }
  /activity-community/profile-cover:
    get:
      operationId: getPersonalProfileCover
      responses:
        "200":
          description: Owner-private profile cover, authenticated and never cacheable
          content:
            image/webp:
              schema: { type: string, format: binary }
        "404": { description: No personal cover selected }
    put:
      operationId: uploadPersonalProfileCover
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200": { description: Cover saved privately and stripped of metadata }
        "400": { description: Invalid image or upload could not complete }
  /activity-community/preferences:
    get:
      operationId: getActivityAudiencePreference
      responses:
        "200":
          description: Explicit recorded-activity default; null until first choice
          content:
            application/json:
              schema:
                type: object
                properties:
                  audience: { type: ["string", "null"], enum: [public, followers, private, null] }
                  publicAccess: { type: string }
    put:
      operationId: setActivityAudiencePreference
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityAudienceInput" }
      responses:
        "200": { description: Default saved }
  /activity-community:
    get:
      operationId: getActivityRoutes
      summary: Signed-in community recordings, never verified trails; audience enforced server-side
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - name: mountainId
          in: query
          description: Exact catalogue mountain association; accepts a raw ID or sde:mountain-prefixed ID. Unlinked recordings are excluded.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 1000 } }
        - { name: saved, in: query, schema: { type: string, enum: ["1"] } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Page of accessible routes
          content:
            application/json:
              schema:
                type: object
                required: [routes, hasMore]
                properties:
                  routes: { type: array, items: { $ref: "#/components/schemas/ActivityCommunityRoute" } }
                  hasMore: { type: boolean }
        "401": { description: Sign-in required }
        "503": { description: Sharing schema or service unavailable }
  /activity-community/{owner}/{hikeId}:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: hikeId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getActivityRoute
      responses:
        "200":
          description: Accessible original recording geometry, never a catalogue route
          content:
            application/json:
              schema:
                type: object
                required: [route, followed]
                properties:
                  route: { $ref: "#/components/schemas/ActivityCommunityRoute" }
                  followed: { type: boolean }
        "404": { description: Missing or no longer accessible; no geometry returned }
  /activity-community/{owner}/{hikeId}/audience:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: hikeId, in: path, required: true, schema: { type: string } }
    put:
      operationId: setActivityRouteAudience
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityAudienceInput" }
      responses:
        "200": { description: Owner's audience changed }
        "409": { description: Recording must be backed up first }
  /activity-community/{owner}/{hikeId}/action:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: hikeId, in: path, required: true, schema: { type: string } }
    post:
      operationId: actOnRecordedActivityRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityRouteActionInput"
      responses:
        "200": { description: Idempotent bookmark/report or pending trail suggestion; never automatic verification }
        "404": { description: Route is not accessible }
  /activity-community/follows/{owner}:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
    put:
      operationId: followActivityAuthor
      responses:
        "200": { description: Author followed }
    delete:
      operationId: unfollowActivityAuthor
      responses:
        "204": { description: Follow removed }
  /recorded-hikes:
    get:
      operationId: listRecordedHikeBackups
      summary: List the signed-in walker's private recorded hike backups
      parameters:
        - in: query
          name: cursor
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Owner-private backups, newest first
          content:
            application/json:
              schema:
                type: object
                required: [backups]
                properties:
                  nextCursor: { type: [string, "null"] }
                  backups:
                    type: array
                    items:
                      type: object
                      required: [hikeId, revision, snapshot, updatedAt]
                      properties:
                        hikeId: { type: string }
                        revision: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                        deletedAt: { type: [string, "null"], format: date-time }
                        snapshot:
                          anyOf:
                            - $ref: "#/components/schemas/PrivateRecordedHikeSnapshot"
                            - type: "null"
        "401": { description: Sign-in required; never a browser redirect }
        "503": { description: Private backup storage unavailable }
    put:
      operationId: backupRecordedHike
      summary: Back up a recorded hike privately without awarding activity credits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateRecordedHikeBackupInput"
      responses:
        "200":
          description: Backup durably accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, hikeId, revision]
                properties:
                  ok: { type: boolean }
                  hikeId: { type: string }
                  revision: { type: string, format: date-time }
        "400": { description: Invalid snapshot }
        "401": { description: Sign-in required }
        "409": { description: A newer revision exists }
        "503": { description: Private backup storage unavailable }
  /recorded-hikes/{id}:
    delete:
      operationId: deleteRecordedHikeBackup
      summary: Delete only the signed-in walker's backup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Backup deleted }
        "401": { description: Sign-in required }
        "503": { description: Private backup storage unavailable }
  /virtual-expedition:
    post:
      operationId: searchVirtualExpedition
      summary: Resolve an expedition target or build its local walking stages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualExpeditionSearchInput"
      responses:
        "200":
          description: Target profile or expedition recommendations
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Invalid search or walking-day count }
        "409": { description: Choose a matching mountain or target route }
        "429": { description: Search allowance reached }
  /mountain-discovery:
    get:
      operationId: getMountainDiscovery
      tags: [mountains]
      summary: Search mountain names and places with paginated summit-height filtering
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 100 }, description: "Search term; empty only with browse=1." }
        - { name: browse, in: query, schema: { type: string, enum: ["1"] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { name: summitMinM, in: query, schema: { type: number, minimum: -500, maximum: 10000 } }
        - { name: summitMaxM, in: query, schema: { type: number, minimum: -500, maximum: 10000 } }
        - { name: sort, in: query, schema: { type: string, enum: [recommended, name_asc, summit_asc, summit_desc], default: recommended } }
      responses:
        "200":
          description: Mountain results filtered and ordered before pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountainDiscoveryPage"
        "400": { description: Invalid search or height range }
        "503": { description: Mountain catalogue unavailable }
  /directions/parking-options:
    post:
      operationId: lookupMountainParkingOptions
      summary: Find sourced parking suggestions and reuse shared research
      tags: [directions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MountainParkingLookupInput"
      responses:
        "200":
          description: Sourced suggestions, never a guarantee of access or parking availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountainParkingLookupResult"
        "400":
          description: Invalid mountain identity
        "503":
          description: Research is temporarily unavailable
  /map-tiles/os-outdoor/{z}/{x}/{y}:
    get:
      operationId: getOsOutdoorTile
      summary: Server-proxied OS Outdoor Web Mercator raster tile
      description: No key reaches the client. No HTTP caching; native downloads enforce the separate 22-hour day-cache window.
      parameters:
        - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 17 } }
        - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: y, in: path, required: true, description: "Tile row, optionally with a .png suffix", schema: { type: string } }
      responses:
        "200":
          description: PNG tile
          content:
            image/png:
              schema: { type: string, format: binary }
        "400": { description: Invalid tile address }
        "429":
          description: Local tile budget exceeded or OS upstream throttled
          headers:
            Retry-After:
              description: Wait at least this many seconds or until this HTTP date before retrying
              schema: { type: string }
        "502": { description: Upstream failed or did not return a valid PNG }
        "503": { description: OS server key is not configured }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /artwork/status:
    get:
      operationId: getArtworkStatus
      tags: [artwork]
      summary: Get artwork status for all active challenges
      responses:
        "200":
          description: List of challenge artwork statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkStatusList"

  /artwork/mountains/{mountainId}/prompt:
    get:
      operationId: getMountainHeroPrompt
      tags: [artwork]
      summary: Get the editable default mountain hero prompt
      parameters:
        - name: mountainId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Default prompt and reference availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountainHeroPrompt"
        "404":
          description: Mountain not found

  /artwork/mountains/{mountainId}/generate:
    post:
      operationId: generateMountainHero
      tags: [artwork]
      summary: Generate a review-only mountain hero with an optional edited prompt
      parameters:
        - name: mountainId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MountainHeroGenerationInput"
      responses:
        "202":
          description: Generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountainHeroGenerationStarted"
        "400":
          description: Invalid prompt or missing confirmation
        "409":
          description: Generation already in progress

  /artwork/prompt/{challengeId}:
    get:
      operationId: getArtworkPrompt
      tags: [artwork]
      summary: Get the auto-built prompt for a challenge without generating
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The auto-built prompt and hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkPrompt"
        "404":
          description: Challenge not found

  /artwork/generate/{challengeId}:
    post:
      operationId: generateArtwork
      tags: [artwork]
      summary: Generate artwork for a single challenge
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateArtworkInput"
      responses:
        "200":
          description: Generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkGenerateResult"
        "500":
          description: Generation failed

  /artwork/approve/{challengeId}:
    post:
      operationId: approveArtwork
      tags: [artwork]
      summary: Approve artwork for a challenge
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkApproveResult"

  /artwork/reject/{challengeId}:
    post:
      operationId: rejectArtwork
      tags: [artwork]
      summary: Reject artwork for a challenge
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkRejectResult"

  /artwork/{challengeId}:
    delete:
      operationId: clearArtwork
      tags: [artwork]
      summary: Clear all artwork for a challenge
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkClearResult"

  /elevation-bank:
    get:
      operationId: getElevationBank
      tags: [elevation]
      summary: Get the authenticated user's personal Elevation Bank
      description: Returns ledger-backed credited ascent when the development-only Stage 2 dependency is available.
      responses:
        "200":
          description: Elevation Bank summary and recent effective credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevationBankResponse"
        "401":
          description: Authentication required
        "503":
          description: Elevation Bank is not available in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevationBankUnavailable"
        "500":
          description: Elevation Bank could not be loaded

  /canonical-history:
    get:
      operationId: getCanonicalHistory
      tags: [activity]
      summary: Read the authenticated user's development canonical history projection
      description: Returns a shadowed response until canonical and legacy history equivalence is proven and explicitly enabled in development/test.
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, training, expeditions, mountains_free_hike]
            default: all
      responses:
        "200":
          description: Canonical history projection or safe shadowed fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalHistoryResponse"
        "400":
          description: Invalid history filter
        "401":
          description: Authentication required
        "503":
          description: Canonical history dependency unavailable

  /community/posts/{id}/like:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: likeCommunityPost
      tags: [community]
      summary: Like an accessible post, idempotently
      responses:
        "200":
          description: Current reaction totals for this viewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityEngagement" }
        "401": { description: Sign in required }
        "404": { description: Post not accessible }
    delete:
      operationId: unlikeCommunityPost
      tags: [community]
      summary: Remove only the signed-in member's like, idempotently
      responses:
        "200":
          description: Current reaction totals for this viewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityEngagement" }
        "401": { description: Sign in required }
        "404": { description: Post not accessible }
  /community/posts/{id}/comments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCommunityComments
      tags: [community]
      summary: Read a page of comments only while the parent post is accessible
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Newest-first comments and an opaque continuation cursor preserving timestamp precision
          content:
            application/json:
              schema:
                type: object
                required: [comments, nextCursor]
                properties:
                  comments: { type: array, items: { $ref: "#/components/schemas/CommunityComment" } }
                  nextCursor: { type: [string, "null"] }
        "400": { description: Invalid cursor }
        "401": { description: Sign in required }
        "404": { description: Post not accessible }
    post:
      operationId: createCommunityComment
      tags: [community]
      summary: Add a comment with an account-and-post-scoped retry key
      parameters:
        - { name: X-Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 600 }
      responses:
        "201":
          description: Comment saved, including unchanged retries
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved: { type: boolean }
        "400": { description: Invalid comment or retry key }
        "401": { description: Sign in required }
        "404": { description: Post not accessible }
        "409": { description: Retry key already used for different content }
  /community/posts/{id}/comments/{commentId}:
    delete:
      operationId: deleteCommunityComment
      tags: [community]
      summary: Delete your own comment, or moderate a comment on your own post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: commentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Comment deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        "401": { description: Sign in required }
        "404": { description: Post or comment not accessible }
  /community/posts:
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Create a private-by-default member post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostCreate"
      responses:
        "201":
          description: Created community post
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post:
                    $ref: "#/components/schemas/CommunityPost"
        "400":
          description: Invalid post
        "401":
          description: Authentication required
    get:
      operationId: getCommunityPosts
      tags: [community]
      summary: Read owned posts or posts visible to members
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, members]
            default: mine
      responses:
        "200":
          description: Community posts (private posts from other owners are excluded)
          content:
            application/json:
              schema:
                type: object
                required: [posts]
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunityPost"
        "401":
          description: Authentication required

  /community/posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateCommunityPostVisibility
      tags: [community]
      summary: Update visibility of an owned post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostVisibilityInput"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post:
                    $ref: "#/components/schemas/CommunityPost"
        "401":
          description: Authentication required
        "404":
          description: Post not found or not owned
    delete:
      operationId: deleteCommunityPost
      tags: [community]
      summary: Delete an owned post and its photo
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
        "401":
          description: Authentication required
        "404":
          description: Post not found or not owned

  /community/posts/{id}/photo:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: uploadCommunityPostPhoto
      tags: [community]
      summary: Upload one private, normalized image to an owned photo post
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Photo attached; visibility remains private
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post:
                    $ref: "#/components/schemas/CommunityPost"
        "400":
          description: Invalid image or oversized body
        "401":
          description: Authentication required
        "409":
          description: Photo already attached
        "415":
          description: Unsupported or mismatched image content
    get:
      operationId: getCommunityPostPhoto
      tags: [community]
      summary: Read photo only when the post is visible to the signed-in member
      responses:
        "200":
          description: Normalized WebP photo
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "404":
          description: Photo not found or not visible to this member

  /community/posts/{id}/report:
    post:
      operationId: reportCommunityPost
      tags: [community]
      summary: Report another member's visible post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Report recorded
          content:
            application/json:
              schema:
                type: object
                required: [reported]
                properties:
                  reported:
                    type: boolean
        "401":
          description: Authentication required
        "404":
          description: Post not found or not visible

components:
  schemas:
    LocalHillSourcePeak:
      type: object
      required: [id, name, aliases, lat, lng, ele]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        ele: { type: [number, "null"], description: Summit height above sea level, never training ascent }
    LocalHillSourceRegion:
      type: object
      required: [region, url, sha256, dataTimestamp, count]
      properties:
        region: { type: string }
        url: { type: string }
        sha256: { type: string }
        dataTimestamp: { type: string }
        count: { type: integer }
    LocalHillReviewedAlias:
      type: object
      required: [osmNodeId, sourceName, lat, lng, displayName, aliases, reviewedAt, evidenceUrls]
      properties:
        osmNodeId: { type: integer }
        sourceName: { type: string }
        lat: { type: number }
        lng: { type: number }
        displayName: { type: string }
        aliases: { type: array, items: { type: string } }
        reviewedAt: { type: string }
        evidenceUrls: { type: array, items: { type: string } }
    LocalHillSourceSnapshot:
      type: object
      required: [schemaVersion, coverage, builtAt, attribution, licence, licenceUrl, sourceUrl, sources, peaks]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        coverage: { type: string, enum: ["United Kingdom and Ireland"] }
        builtAt: { type: string }
        attribution: { type: string }
        licence: { type: string, enum: ["ODbL-1.0"] }
        licenceUrl: { type: string }
        sourceUrl: { type: string }
        reviewedAliases: { type: array, items: { $ref: "#/components/schemas/LocalHillReviewedAlias" } }
        sources: { type: array, items: { $ref: "#/components/schemas/LocalHillSourceRegion" } }
        peaks: { type: array, items: { $ref: "#/components/schemas/LocalHillSourcePeak" } }
    MembershipActionInput:
      type: object
      required: [feature]
      properties:
        feature: { type: string, enum: [training, expedition] }
        expeditionId: { type: string, description: Catalogue identity, never a client free flag }
    RouteCandidateInput:
      type: object
      additionalProperties: false
      required: [candidateKey, revisionVersion, geometryFile, sourceManifest]
      properties:
        candidateKey: { type: string, minLength: 1, maxLength: 160 }
        revisionVersion: { type: string, minLength: 1, maxLength: 100 }
        geometryFile: { type: string, maxLength: 2000000 }
        sourceManifest:
          type: array
          minItems: 1
          maxItems: 2000
          items: { type: object, additionalProperties: true }
        canonicalGeometryId: { type: string, format: uuid }
        profileFile: { type: string, maxLength: 2000000 }
        terrainManifestFile: { type: string, maxLength: 500000 }
    RouteReviewEnvelope:
      type: object
      description: Admin-only version metadata and review histories
      additionalProperties: true
    RouteReviewCreated:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    RouteReviewPreview:
      type: object
      required: [valid, errors, warnings, blockers, pointCount, bindingCurrent, profileIncluded, elevationCoverageComplete, files]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        blockers: { type: array, items: { type: string } }
        pointCount: { type: integer }
        bindingCurrent: { type: boolean }
        profileIncluded: { type: boolean }
        elevationCoverageComplete: { type: boolean }
        files:
          type: array
          items:
            type: object
            required: [name, sha256, bytes]
            properties:
              name: { type: string }
              sha256: { type: string }
              bytes: { type: integer }
    RouteReviewValidationInput:
      type: object
      additionalProperties: false
      required: [outcome, sourceRightsReviewed, routeAccessReviewed, terrainRightsReviewed, profileReviewed, authority, reason]
      properties:
        outcome: { type: string, enum: [needs_review, rejected, accepted] }
        sourceRightsReviewed: { type: boolean }
        routeAccessReviewed: { type: boolean }
        terrainRightsReviewed: { type: boolean }
        profileReviewed: { type: boolean }
        authority: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        validUntil: { type: string, format: date-time }
    RouteReviewDecisionInput:
      type: object
      additionalProperties: false
      required: [decision, validationId, expectedDecisionId, authority, reason]
      properties:
        decision: { type: string, enum: [approved, revoked] }
        validationId: { type: string, format: uuid }
        expectedDecisionId: { type: [string, "null"], format: uuid }
        authority: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ExpeditionUpdateRequest:
      type: object
      required: [expedition, expectedUpdatedAt]
      properties:
        expedition: { $ref: "#/components/schemas/AdminExpeditionInput" }
        expectedUpdatedAt: { type: string }
    ExpeditionDeleteRequest:
      type: object
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt: { type: string }
    ExpeditionCatalogueMountain:
      type: object
      required: [id, name, latitude, longitude, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: ["string", "null"] }
        region: { type: ["string", "null"] }
        latitude: { type: number }
        longitude: { type: number }
        elevationM: { type: ["number", "null"] }
        status: { type: string }
    AdminExpeditionGenerationPreview:
      type: object
      required: [draft, warnings]
      properties:
        draft:
          oneOf:
            - { $ref: "#/components/schemas/AdminExpeditionRecord" }
            - { type: "null" }
        warnings: { type: array, items: { type: string } }
        manualBuilder: { $ref: "#/components/schemas/AdminExpeditionManualBuilder" }
    ExpeditionArtworkAssignment:
      type: object
      required: [sourceChallengeId, sourceImageVersion, expectedUpdatedAt]
      properties:
        sourceChallengeId: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{2,39}$" }
        sourceImageVersion: { type: integer, minimum: 1, maximum: 32767 }
        expectedUpdatedAt: { type: string, minLength: 1, maxLength: 100 }
        replaceExisting: { type: boolean, default: false }
    AdminExpeditionManualBuilder:
      type: object
      required: [eligibleSummitPool, selectedRouteIdentityKeys, targetDna]
      properties:
        selectedRouteIdentityKeys: { type: array, items: { type: string } }
        eligibleSummitPool:
          type: array
          items:
            type: object
            required: [summitName, summitIdentityKey, routes]
            properties:
              summitName: { type: string }
              summitIdentityKey: { type: string }
              summitElevationASL: { type: ["number", "null"] }
              routes:
                type: array
                items:
                  type: object
                  required: [routeName, routeIdentityKey, summitIdentityKey, routeGainM]
                  properties:
                    routeName: { type: ["string", "null"] }
                    routeIdentityKey: { type: ["string", "null"] }
                    summitIdentityKey: { type: string }
                    routeGainM: { type: number }
                    routeDistanceKm: { type: ["number", "null"] }
                    estimatedAverageGradientPercent: { type: ["number", "null"] }
                    difficulty: { type: ["string", "null"] }
                    technicalCharacter: { type: ["string", "null"] }
                    provenance:
                      type: object
                      additionalProperties: true
                      properties:
                        dataSource: { type: string }
                        routeDataStatus: { type: string }
                        confidence: { type: string }
        targetDna:
          type: object
          required: [elevationGainM, distanceKm]
          properties:
            elevationGainM: { type: number }
            distanceKm: { type: number }
            averageGradientPercent: { type: ["number", "null"] }
            technicalCharacter: { type: ["string", "null"] }
        liveDna: { type: object, additionalProperties: true }
    AdminExpeditionStageInput:
      type: object
      additionalProperties: false
      required: [routeName, distanceKm, ascentM]
      properties:
        routeName: { type: string, maxLength: 200 }
        routeKey: { type: string, maxLength: 200 }
        mountainId: { type: string, format: uuid }
        region: { type: string, maxLength: 200 }
        distanceKm: { type: number, exclusiveMinimum: 0, maximum: 1000 }
        ascentM: { type: number, minimum: 0, maximum: 20000 }
        estimatedHours: { type: number, exclusiveMinimum: 0, maximum: 240 }
        difficulty: { type: string, maxLength: 80 }
        dnaContribution: { type: string, maxLength: 1000 }
        whySelected: { type: string, maxLength: 2000 }
    AdminExpeditionInput:
      type: object
      additionalProperties: false
      required: [challengeId, challengeName, targetMountainName, stages]
      properties:
        challengeId: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{2,39}$" }
        challengeName: { type: string, maxLength: 200 }
        targetMountainName: { type: string, maxLength: 200 }
        targetRoute: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 4000 }
        regions: { type: string, maxLength: 500 }
        difficulty: { type: string, maxLength: 80 }
        recommendedDays: { type: integer, minimum: 1, maximum: 365 }
        status: { type: string, enum: [draft, active, hidden], default: draft }
        reviewed: { type: boolean }
        stages: { type: array, minItems: 1, maxItems: 30, items: { $ref: "#/components/schemas/AdminExpeditionStageInput" } }
        limitations: { type: array, maxItems: 30, items: { type: string, maxLength: 2000 } }
    AdminExpeditionRecord:
      type: object
      required: [challengeId, challengeName, targetMountainName, status, updatedAt, stages, limitations]
      properties:
        challengeId: { type: string }
        challengeName: { type: string }
        targetMountainName: { type: string }
        status: { type: string, enum: [draft, active, hidden] }
        updatedAt: { type: string }
        stages:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              catalogueMountain:
                oneOf:
                  - { $ref: "#/components/schemas/ExpeditionCatalogueMountain" }
                  - { type: "null" }
        limitations: { type: array, items: { type: string } }
      additionalProperties: true
    ExpeditionImportBatch:
      type: object
      additionalProperties: false
      required: [expeditions]
      properties:
        expeditions: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/AdminExpeditionInput" } }
    ExpeditionImportPreview:
      type: object
      required: [valid, entries, errors]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
        entries:
          type: array
          items:
            type: object
            required: [index, challengeId, challengeName, errors, warnings, expedition]
            properties:
              index: { type: integer }
              challengeId: { type: string }
              challengeName: { type: string }
              errors: { type: array, items: { type: string } }
              warnings: { type: array, items: { type: string } }
              expedition:
                oneOf:
                  - { $ref: "#/components/schemas/AdminExpeditionInput" }
                  - { type: "null" }
    WeatherHour:
      type: object
      required: [time, temperatureC, feelsLikeC, rainChance, windMph, condition, conditionCode, isDay]
      properties:
        time: { type: number, description: Unix seconds }
        temperatureC: { type: number }
        feelsLikeC: { type: number }
        rainChance: { type: number, minimum: 0, maximum: 100 }
        windMph: { type: number }
        gustMph: { type: ["number", "null"] }
        condition: { type: string }
        conditionCode: { type: integer }
        isDay: { type: boolean }
    WeatherDay:
      type: object
      required: [date, minC, maxC, rainChance, condition, conditionCode, hours]
      properties:
        date: { type: string }
        minC: { type: number }
        maxC: { type: number }
        rainChance: { type: number }
        condition: { type: string }
        conditionCode: { type: integer }
        hours: { type: array, items: { $ref: "#/components/schemas/WeatherHour" } }
    MountainWeather:
      type: object
      required: [provider, fetchedAt, updatedAt, timezone, locationName, latitude, longitude, days]
      properties:
        provider: { type: string, enum: [WeatherAPI.com] }
        fetchedAt: { type: string }
        updatedAt: { type: string }
        timezone: { type: string }
        locationName: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        days: { type: array, items: { $ref: "#/components/schemas/WeatherDay" } }
    ActivityRouteActionInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [save, unsave, report, suggest] }
        reason: { type: string, maxLength: 1000 }
    ActivityAudienceInput:
      type: object
      required: [audience]
      properties:
        audience: { type: string, enum: [public, followers, private] }
    ActivityCommunityRoute:
      type: object
      required: [owner, hikeId, audience, author, source, verified, snapshot]
      properties:
        owner: { type: string }
        hikeId: { type: string }
