openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: artwork
    description: AI Artwork Pipeline operations
  - name: community
    description: Authenticated SummitReady member sharing
paths:
  /map-tiles/os-outdoor/{z}/{x}/{y}:
    get:
      operationId: getOsOutdoorTile
      summary: Server-proxied OS Outdoor Web Mercator raster tile
      description: No key reaches the client. No HTTP caching; native downloads enforce the separate 22-hour day-cache window.
      parameters:
        - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 17 } }
        - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: y, in: path, required: true, description: "Tile row, optionally with a .png suffix", schema: { type: string } }
      responses:
        "200":
          description: PNG tile
          content:
            image/png:
              schema: { type: string, format: binary }
        "400": { description: Invalid tile address }
        "429": { description: Tile request budget exceeded }
        "502": { description: Upstream failed or did not return a valid PNG }
        "503": { description: OS server key is not configured }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /artwork/status:
    get:
      operationId: getArtworkStatus
      tags: [artwork]
      summary: Get artwork status for all active challenges
      responses:
        "200":
          description: List of challenge artwork statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkStatusList"

  /artwork/mountains/{mountainId}/prompt:
    get:
      operationId: getMountainHeroPrompt
      tags: [artwork]
      summary: Get the editable default mountain hero prompt
      parameters:
        - name: mountainId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Default prompt and reference availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountainHeroPrompt"
        "404":
          description: Mountain not found

  /artwork/mountains/{mountainId}/generate:
    post:
      operationId: generateMountainHero
      tags: [artwork]
      summary: Generate a review-only mountain hero with an optional edited prompt
      parameters:
        - name: mountainId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MountainHeroGenerationInput"
      responses:
        "202":
          description: Generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountainHeroGenerationStarted"
        "400":
          description: Invalid prompt or missing confirmation
        "409":
          description: Generation already in progress

  /artwork/prompt/{challengeId}:
    get:
      operationId: getArtworkPrompt
      tags: [artwork]
      summary: Get the auto-built prompt for a challenge without generating
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The auto-built prompt and hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkPrompt"
        "404":
          description: Challenge not found

  /artwork/generate/{challengeId}:
    post:
      operationId: generateArtwork
      tags: [artwork]
      summary: Generate artwork for a single challenge
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateArtworkInput"
      responses:
        "200":
          description: Generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkGenerateResult"
        "500":
          description: Generation failed

  /artwork/approve/{challengeId}:
    post:
      operationId: approveArtwork
      tags: [artwork]
      summary: Approve artwork for a challenge
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkApproveResult"

  /artwork/reject/{challengeId}:
    post:
      operationId: rejectArtwork
      tags: [artwork]
      summary: Reject artwork for a challenge
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkRejectResult"

  /artwork/{challengeId}:
    delete:
      operationId: clearArtwork
      tags: [artwork]
      summary: Clear all artwork for a challenge
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkClearResult"

  /elevation-bank:
    get:
      operationId: getElevationBank
      tags: [elevation]
      summary: Get the authenticated user's personal Elevation Bank
      description: Returns ledger-backed credited ascent when the development-only Stage 2 dependency is available.
      responses:
        "200":
          description: Elevation Bank summary and recent effective credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevationBankResponse"
        "401":
          description: Authentication required
        "503":
          description: Elevation Bank is not available in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevationBankUnavailable"
        "500":
          description: Elevation Bank could not be loaded

  /canonical-history:
    get:
      operationId: getCanonicalHistory
      tags: [activity]
      summary: Read the authenticated user's development canonical history projection
      description: Returns a shadowed response until canonical and legacy history equivalence is proven and explicitly enabled in development/test.
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, training, expeditions, mountains_free_hike]
            default: all
      responses:
        "200":
          description: Canonical history projection or safe shadowed fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalHistoryResponse"
        "400":
          description: Invalid history filter
        "401":
          description: Authentication required
        "503":
          description: Canonical history dependency unavailable

  /community/posts:
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Create a private-by-default member post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostCreate"
      responses:
        "201":
          description: Created community post
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post:
                    $ref: "#/components/schemas/CommunityPost"
        "400":
          description: Invalid post
        "401":
          description: Authentication required
    get:
      operationId: getCommunityPosts
      tags: [community]
      summary: Read owned posts or posts visible to members
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, members]
            default: mine
      responses:
        "200":
          description: Community posts (private posts from other owners are excluded)
          content:
            application/json:
              schema:
                type: object
                required: [posts]
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunityPost"
        "401":
          description: Authentication required

  /community/posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateCommunityPostVisibility
      tags: [community]
      summary: Update visibility of an owned post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostVisibilityInput"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post:
                    $ref: "#/components/schemas/CommunityPost"
        "401":
          description: Authentication required
        "404":
          description: Post not found or not owned
    delete:
      operationId: deleteCommunityPost
      tags: [community]
      summary: Delete an owned post and its photo
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
        "401":
          description: Authentication required
        "404":
          description: Post not found or not owned

  /community/posts/{id}/photo:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: uploadCommunityPostPhoto
      tags: [community]
      summary: Upload one private, normalized image to an owned photo post
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Photo attached; visibility remains private
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post:
                    $ref: "#/components/schemas/CommunityPost"
        "400":
          description: Invalid image or oversized body
        "401":
          description: Authentication required
        "409":
          description: Photo already attached
        "415":
          description: Unsupported or mismatched image content
    get:
      operationId: getCommunityPostPhoto
      tags: [community]
      summary: Read photo only when the post is visible to the signed-in member
      responses:
        "200":
          description: Normalized WebP photo
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "404":
          description: Photo not found or not visible to this member

  /community/posts/{id}/report:
    post:
      operationId: reportCommunityPost
      tags: [community]
      summary: Report another member's visible post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Report recorded
          content:
            application/json:
              schema:
                type: object
                required: [reported]
                properties:
                  reported:
                    type: boolean
        "401":
          description: Authentication required
        "404":
          description: Post not found or not visible

components:
  schemas:
    CommunityPostCreate:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [story, badge, photo]
        text:
          type: string
          maxLength: 600
        badgeId:
          type: ["string", "null"]
          maxLength: 128
        badgeTitle:
          type: ["string", "null"]
          maxLength: 160
        visibility:
          type: string
          enum: [private, members]
          default: private
    CommunityPostVisibilityInput:
      type: object
      required: [visibility]
      properties:
        visibility:
          type: string
          enum: [private, members]
    CommunityPost:
      type: object
      required: [id, kind, text, badgeId, badgeTitle, visibility, authorName, authorAvatarUrl, ownerUserId, createdAt, hasPhoto]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [story, badge, photo]
        text:
          type: string
        badgeId:
          type: ["string", "null"]
        badgeTitle:
          type: ["string", "null"]
        visibility:
          type: string
          enum: [private, members]
        authorName:
          type: string
        authorAvatarUrl:
          type: ["string", "null"]
          format: uri
        ownerUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        hasPhoto:
          type: boolean
    MountainHeroPrompt:
      type: object
      required: [prompt, hasReference]
      properties:
        prompt:
          type: string
        hasReference:
          type: boolean

    MountainHeroGenerationInput:
      type: object
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
        prompt:
          type: string
          minLength: 20
          maxLength: 4000

    MountainHeroGenerationStarted:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ChallengeArtworkStatus:
      type: object
      required:
        - challengeId
        - challengeName
        - targetMountainName
      properties:
        challengeId:
          type: string
        challengeName:
          type: string
        targetMountainName:
          type: string
        regions:
          type: ["string", "null"]
        difficulty:
          type: ["string", "null"]
        adventureScore:
          type: ["number", "null"]
        heroImage:
          type: ["string", "null"]
        cardImage:
          type: ["string", "null"]
        thumbnailImage:
          type: ["string", "null"]
        imagePrompt:
          type: ["string", "null"]
        imageVersion:
          type: ["integer", "null"]
        imageStatus:
          type: ["string", "null"]
        approved:
          type: ["boolean", "null"]
        generatedAt:
          type: ["string", "null"]
        provider:
          type: ["string", "null"]
        generationCost:
          type: ["number", "null"]
        lastGenerated:
          type: ["string", "null"]

    ArtworkStatusList:
      type: object
      required: [challenges, total]
      properties:
        challenges:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeArtworkStatus"
        total:
          type: integer

    ArtworkPrompt:
      type: object
      required: [prompt, hash, challengeId]
      properties:
        prompt:
          type: string
        hash:
          type: string
        challengeId:
          type: string

    GenerateArtworkInput:
      type: object
      properties:
        force:
          type: boolean

    ArtworkGenerateResult:
      type: object
      required: [challengeId, status]
      properties:
        challengeId:
          type: string
        status:
          type: string
        reason:
          type: ["string", "null"]
        prompt:
          type: ["string", "null"]
        heroPath:
          type: ["string", "null"]

    ArtworkApproveResult:
      type: object
      required: [challengeId, approved]
      properties:
        challengeId:
          type: string
        approved:
          type: boolean

    ArtworkRejectResult:
      type: object
      required: [challengeId, approved, status]
      properties:
        challengeId:
          type: string
        approved:
          type: boolean
        status:
          type: string

    ArtworkClearResult:
      type: object
      required: [challengeId, cleared]
      properties:
        challengeId:
          type: string
        cleared:
          type: boolean

    ElevationBankCredit:
      type: object
      required: [activityId, sourceId, sourceType, revision, status, creditedAscentM, evidenceClass, ruleVersion, effectiveAt]
      properties:
        activityId:
          type: string
        sourceId:
          type: string
        sourceType:
          type: string
        revision:
          type: integer
        status:
          type: string
          enum: [credited, corrected]
        creditedAscentM:
          type: integer
        evidenceClass:
          type: string
        ruleVersion:
          type: string
        effectiveAt:
          type: string
          format: date-time

    ElevationBankResponse:
      type: object
      required: [status, lifetimeAscentM, periodAscentM, creditedActivities, everestEquivalent, recentCredits, recentEvents]
      properties:
        status:
          type: string
          enum: [available]
        lifetimeAscentM:
          type: integer
        periodAscentM:
          type: integer
        creditedActivities:
          type: integer
        everestEquivalent:
          type: number
        recentCredits:
          type: array
          items:
            $ref: "#/components/schemas/ElevationBankCredit"
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/ElevationBankEvent"

    ElevationBankEvent:
      type: object
      required: [activityId, sourceId, sourceType, revision, status, creditedAscentM, evidenceClass, ruleVersion, effectiveAt, eventAt]
      properties:
        activityId:
          type: string
        sourceId:
          type: string
        sourceType:
          type: string
        revision:
          type: integer
        status:
          type: string
          enum: [credited, corrected, revoked]
        creditedAscentM:
          type: integer
        evidenceClass:
          type: string
        ruleVersion:
          type: string
        effectiveAt:
          type: string
          format: date-time
        eventAt:
          type: string
          format: date-time

    ElevationBankUnavailable:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [unavailable]
        reason:
          type: string
          enum: [development_dependency_unavailable, load_failed]

    CanonicalHistoryLink:
      type: object
      required: [linkType, targetId]
      properties:
        linkType:
          type: string
        targetId:
          type: string
        metadata:
          type: object
          additionalProperties: true

    CanonicalHistoryItem:
      type: object
      required: [id, sourceType, sourceId, primaryContext, activityKind, occurredAt, lifecycle, evidenceState, visibility, matchedContexts, links]
      properties:
        id:
          type: string
        sourceType:
          type: string
        sourceId:
          type: string
        primaryContext:
          type: string
        activityKind:
          type: string
        occurredAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        durationSeconds:
          type: ["integer", "null"]
        distanceKm:
          type: ["number", "null"]
        recordedAscentM:
          type: ["integer", "null"]
        validatedAscentM:
          type: ["integer", "null"]
        descentM:
          type: ["integer", "null"]
        lifecycle:
          type: string
        evidenceState:
          type: string
        visibility:
          type: string
        matchedContexts:
          type: array
          items:
            type: string
            enum: [training, expeditions, mountains_free_hike]
        links:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalHistoryLink"

    CanonicalHistoryResponse:
      type: object
      required: [status, reason, items]
      properties:
        status:
          type: string
          enum: [active, shadowed, unavailable]
        reason:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalHistoryItem"
