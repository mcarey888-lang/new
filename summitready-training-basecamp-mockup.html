function icon(name, size) {
  const holder = document.createElement('span');
  holder.innerHTML = ICONS[name] || '';
  const svg = holder.firstElementChild;
  if (svg) { svg.setAttribute('width', size); svg.setAttribute('height', size); svg.style.display = 'block'; }
  return holder.innerHTML;
}
function hydrateIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(n => {
    n.innerHTML = icon(n.dataset.icon, n.dataset.size || 16);
    n.style.display = 'inline-flex';
  });
}
function loadPhotos(root = document) {
  root.querySelectorAll('img[data-src]').forEach(img => {
    if (img.dataset.started || !img.dataset.src) return;
    img.dataset.started = '1';
    img.addEventListener('load', () => img.classList.add('ok'));
    img.addEventListener('error', () => img.remove());   /* .ph gradient stays */
    img.src = img.dataset.src;
  });
}

/* ═══════════════════════════ HELPERS ═══════════════════════════ */
const fmt = n => n.toLocaleString('en-GB');

/* TargetDate — days remaining are derived, never hard-coded */
function daysUntil(iso) {
  const DAY = 86400000;
  const target = new Date(iso + 'T00:00:00');
  const today  = new Date(); today.setHours(0, 0, 0, 0);
  return Math.max(0, Math.round((target - today) / DAY));
}
function prettyDate(iso) {
  return new Date(iso + 'T00:00:00')
    .toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

/* ═════════════════════ ReadinessGauge ═════════════════════
   Geometry is derived from the values, not drawn by hand.
     0%  = 12 o'clock      50% = 6 o'clock
     25% = 3 o'clock       75% = 9 o'clock      sweep is CLOCKWISE
   An <svg> circle starts at 3 o'clock and runs clockwise, so rotating the
   group -90° puts 0% at 12 o'clock with the direction preserved.
   The projected arc begins exactly where the achieved arc ends by offsetting
   its dash pattern by the achieved length. Both arcs use butt caps so the
   join is exact — a round cap would add stroke/2 of overlap.               */
function ReadinessGauge(current, projected, size = 106, stroke = 9) {
  const clamp = v => Math.max(0, Math.min(100, Number(v) || 0));
  const cur  = clamp(current) / 100;
  const proj = Math.max(cur, clamp(projected) / 100);

  const r = (size - stroke) / 2;
  const C = 2 * Math.PI * r;
  const c = size / 2;

  const achievedLen  = cur * C;
  const projectedLen = (proj - cur) * C;

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="block">
    <g transform="rotate(-90 ${c} ${c})">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="${stroke}"/>
      <circle id="gaugeProjected" class="gauge-arc" cx="${c}" cy="${c}" r="${r}" fill="none"
              stroke="rgba(36,239,164,.34)" stroke-width="${stroke}" stroke-linecap="butt"
              stroke-dasharray="${projectedLen} ${C}" stroke-dashoffset="${-achievedLen}"/>
      <circle id="gaugeAchieved" class="gauge-arc" cx="${c}" cy="${c}" r="${r}" fill="none"
              stroke="#24EFA4" stroke-width="${stroke}" stroke-linecap="butt"
              stroke-dasharray="${achievedLen} ${C}" stroke-dashoffset="0"/>
    </g>
  </svg>`;
}

function ReadinessDial(r) {
  const size = 106;
  return `<div class="relative shrink-0" style="width:${size}px;height:${size + 8}px">
    ${ReadinessGauge(r.current, r.projected, size)}
    <div class="absolute inset-x-0 top-0 h-[${size}px] flex flex-col items-center justify-center pointer-events-none">
      <span class="text-accent mb-[1px]" data-icon="mark" data-size="16"></span>
      <div class="flex items-end">
        <span id="readyValue" class="text-[26px] leading-[26px] font-extrabold tracking-[-0.03em]">${Math.round(r.current)}</span>

      </div>
      <div class="mt-[1px] text-[8.5px] font-bold tracking-[0.16em] text-white/62">READY</div>

    <div class="absolute left-1/2 -translate-x-1/2 bottom-0">

/* TrainingSessionCard — one template, every upcoming session */
function TrainingSessionCard(s, i) {
  return `<article data-act="${s.title}" class="pressable cursor-pointer shrink-0 w-[129px] panel rounded-[15px] overflow-hidden">
    <div class="relative h-[76px] ph">
      <img data-src="${s.img}" alt="" class="absolute inset-0 w-full h-full object-cover"/>
      <div class="absolute inset-0" style="background:linear-gradient(to top, rgba(10,17,19,.85) 0%, rgba(5,9,11,0) 55%);"></div>
      <span class="absolute top-[7px] right-[7px] w-[21px] h-[21px] rounded-full bg-black/55 border border-white/18
                   backdrop-blur-md grid place-items-center text-white/90"><span data-icon="chev" data-size="11"></span></span>
    </div>
    <div class="p-[11px] pt-[9px]">
      <div class="text-[10px] leading-[12px] text-white/58 whitespace-nowrap">${s.week}</div>
      <h4 class="mt-[4px] text-[15px] leading-[17px] font-bold tracking-[-0.02em] whitespace-nowrap">${s.title}</h4>
      <div class="mt-[3px] text-[11px] leading-[13px] text-white/72 whitespace-nowrap">${s.detail}</div>
      <div class="mt-[7px] flex items-center gap-[5px] text-[10.5px] leading-[13px] text-white/62 whitespace-nowrap">
        <span class="text-white/55" data-icon="clock" data-size="12"></span>${s.meta}
      </div>
    </div>
  </article>`;
}

function UpNext(list) {
  return `<section class="mt-[19px]">
    <div class="px-[17px] flex items-center justify-between">
      <h2 class="text-[11px] font-semibold tracking-[0.2em] text-white/62">UP NEXT</h2>
      <button data-act="Full Plan" class="pressable flex items-center gap-[6px] text-[12px] font-medium text-white/72">
        View full plan <span data-icon="arrowR" data-size="13"></span>
      </button>
    </div>
    <div id="upNext" class="mt-[10px] flex gap-[7px] overflow-x-auto no-sb px-[17px] pb-[2px]">
      ${list.map(TrainingSessionCard).join('')}
    </div>
  </section>`;
}

function ElevationBank(b) {
  const pct = Math.min(100, Math.round((b.banked / b.required) * 100));
  return `<div data-act="Elevation Bank" class="pressable cursor-pointer flex-1 min-w-0 panel rounded-[16px] p-[13px]">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-[7px] min-w-0">
        <span class="text-accent shrink-0" data-icon="mark" data-size="20"></span>
        <div class="min-w-0">
          <div class="flex items-center gap-[4px] text-[8.5px] font-semibold tracking-[0.13em] text-white/62 whitespace-nowrap">
            ELEVATION BANK <span class="text-white/35" data-icon="info" data-size="10"></span>
          </div>
          <div class="mt-[2px] text-[18px] leading-[21px] font-bold tracking-[-0.025em] whitespace-nowrap">${fmt(b.banked)} m</div>
          <div class="text-[10px] leading-[13px] text-white/52 whitespace-nowrap">of ${fmt(b.required)} m required</div>
        </div>
      </div>
      <span class="shrink-0 w-[24px] h-[24px] rounded-full panel-sub grid place-items-center text-white/80">
        <span data-icon="chev" data-size="12"></span></span>
    </div>
    <div class="mt-[12px] flex items-center gap-[9px]">
      <div class="flex-1 h-[7px] rounded-full bg-white/10 overflow-hidden">
        <div class="h-full rounded-full bg-accent" style="width:${pct}%"></div>
      </div>
      <span class="text-[11.5px] font-semibold text-white/72">${pct}%</span>
    </div>
  </div>`;
}

function WeeklyTrainingProgress(w) {
  return `<div data-act="Training Progress" class="pressable cursor-pointer flex-1 min-w-0 panel rounded-[16px] p-[13px]">
    <div class="flex items-center gap-[7px] text-[8.5px] font-semibold tracking-[0.13em] text-white/62 whitespace-nowrap">
      <span class="text-accent" data-icon="bars" data-size="16"></span> TRAINING PROGRESS
    </div>
    <div class="mt-[10px] flex items-end justify-between gap-[8px]">
      <div class="min-w-0">
        <div class="text-[24px] leading-[26px] font-bold tracking-[-0.03em]">
          ${w.completed}<span class="text-white/38"> / ${w.target}</span>
        </div>
        <div class="mt-[3px] text-[10px] leading-[13px] text-white/58 whitespace-nowrap">sessions this week</div>
      </div>
      <div class="flex items-end gap-[4px]">
        ${w.days.map(d => `<div class="flex flex-col items-center gap-[5px]">
          <div class="w-[6px] rounded-[3px] ${d.done ? 'bg-accent' : 'bg-white/14'}" style="height:${Math.round(d.v * 36)}px"></div>
          <span class="text-[9px] ${d.done ? 'text-white/70' : 'text-white/38'}">${d.d}</span>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function PromoBanner() {
  return `<section class="mt-[13px] px-[17px]">
    <div class="relative h-[94px] rounded-[16px] overflow-hidden ph border border-white/[.07]">
      <img data-src="mockup-assets/tb-banner.jpg" alt="" class="absolute inset-0 w-full h-full object-cover"/>
      <div class="absolute inset-0" style="background:linear-gradient(to right, rgba(5,9,11,.9) 12%, rgba(5,9,11,.48) 52%, rgba(5,9,11,.3) 100%);"></div>
      <div class="absolute left-[16px] top-1/2 -translate-y-1/2">
        <div class="text-[13.5px] leading-[19px] font-semibold tracking-[0.17em]">SMALL STEPS<br/>BIG MOUNTAINS</div>
        <div class="mt-[6px] w-[46px] h-px bg-white/40"></div>
      </div>
      <button data-act="Explore Routes" class="pressable absolute right-[12px] top-1/2 -translate-y-1/2 flex items-center gap-[7px]
                     h-[38px] pl-[15px] pr-[13px] rounded-full bg-black/62 border border-white/15 backdrop-blur-md
                     text-[11.5px] font-bold tracking-[0.06em]">
        EXPLORE ROUTES <span data-icon="arrowR" data-size="13"></span>
      </button>
    </div>
  </section>`;
}

function QuickAction(a) {
  return `<button data-act="${a.label}" class="pressable panel-sub rounded-[14px] h-[74px] flex flex-col items-center justify-center gap-[8px] px-[4px]">
    <span class="text-white/80" data-icon="${a.icon}" data-size="21"></span>
    <span class="text-[10px] font-medium text-white/85 text-center leading-[12px] whitespace-nowrap">${a.label}</span>
  </button>`;
}

function QuickActions(list) {
  return `<section class="mt-[19px] px-[17px]">
    <h2 class="text-[11px] font-semibold tracking-[0.2em] text-white/62">QUICK ACTIONS</h2>
    <div class="mt-[10px] grid grid-cols-4 gap-[8px]">${list.map(QuickAction).join('')}</div>
  </section>`;
}

/* BottomNavigation — the locked SummitReady tab set */
const TABS = [
  { id: 'basecamp',    icon: 'home',    label: 'Basecamp'    },
  { id: 'explore',     icon: 'compass', label: 'Explore'     },
  { id: 'track',       icon: 'boots',   label: 'Track'       },
  { id: 'expeditions', icon: 'peak',    label: 'Expeditions' },
  { id: 'you',         icon: 'user',    label: 'You'         },
];
let activeTab = 'basecamp';

function BottomNavigation() {
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(t => {
    const on = t.id === activeTab;
    return `<button data-tab="${t.id}" class="flex flex-col items-center w-[86px] active:scale-95 transition">
      <span class="grid place-items-center w-[36px] h-[30px] rounded-[11px] transition-colors ${on ? 'bg-accent/[.13]' : ''}">
        ${on ? `<span class="grid place-items-center w-[18px] h-[18px] rounded-full bg-accent text-ink" data-icon="${t.icon}" data-size="12"></span>`
             : `<span class="text-white/55" data-icon="${t.icon}" data-size="25"></span>`}
      </span>
      <span class="mt-[3px] text-[9.5px] leading-[12px] font-medium ${on ? 'text-accent' : 'text-white/55'}">${t.label}</span>
    </button>`;
  }).join('');
  hydrateIcons(el);
  el.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
    activeTab = b.dataset.tab;
    BottomNavigation();
    toast(`→ ${TABS.find(t => t.id === activeTab).label}`);
  }));
}

/* ═══════════════════════════ RENDER ═══════════════════════════ */
function renderScreen() {
  const s = STATE;
  document.getElementById('screen').innerHTML =
      TrainingHero(s.mountain, s.targetDate)
    + ReadinessCompact(s.readiness)
    + TodaysMission(s.mission)
    + UpNext(s.upNext)
    + `<section class="mt-[13px] px-[17px] flex gap-[9px] items-stretch">
         ${ElevationBank(s.elevationBank)}${WeeklyTrainingProgress(s.week)}
       </section>`
    + PromoBanner()
    + QuickActions(s.quickActions);

  hydrateIcons();
  loadPhotos();
}

/* ═══════════════════════ INTERACTIONS ═══════════════════════ */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translate(-50%, 0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translate(-50%, 8px)';
  }, 1500);
}

/* every data-act element reports the navigation it stands for */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.stopPropagation();
  const act = el.dataset.act;
  if (act === 'Start Session') { startSession(); return; }
  toast(`→ ${act}`);
});

/* Start Session gives the button a real state change to evaluate */
function startSession() {
  const btn = document.querySelector('[data-act="Start Session"]');
  if (!btn || btn.dataset.running) return;
  btn.dataset.running = '1';
  btn.innerHTML = `SESSION STARTED ${icon('clock', 14)}`;
  btn.classList.add('opacity-90');
  toast('Hill Session started · tracking elevation');
  setTimeout(() => {
    btn.innerHTML = `${STATE.mission.cta} ${icon('arrowR', 14)}`;
    btn.classList.remove('opacity-90');
    delete btn.dataset.running;
  }, 2600);
}

/* prototype hook — setReadiness(60, 68) redraws the gauge from the maths */
window.setReadiness = (current, projected) => {
  STATE.readiness.current = current;
  STATE.readiness.projected = projected;
  renderScreen();
  return { current, projected };
};

/* shift + wheel scrolls the Up Next rail; plain wheel still scrolls the page */
function wheelRail(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('wheel', ev => {
    if (ev.shiftKey && Math.abs(ev.deltaY) > Math.abs(ev.deltaX)) { el.scrollLeft += ev.deltaY; ev.preventDefault(); }
  }, { passive: false });
}

/* ═══════════════════════════ BOOT ═══════════════════════════ */
renderScreen();
BottomNavigation();
wheelRail('upNext');
</script>
