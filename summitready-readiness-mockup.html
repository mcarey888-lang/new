function icon(n, s) {
  const h = document.createElement('span'); h.innerHTML = ICONS[n] || '';
  const g = h.firstElementChild;
  if (g) { g.setAttribute('width', s); g.setAttribute('height', s); g.style.display = 'block'; }
  return h.innerHTML;
}
function hydrateIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(n => {
    n.innerHTML = icon(n.dataset.icon, n.dataset.size || 16); n.style.display = 'inline-flex';
  });
}
function loadPhotos(root = document) {
  root.querySelectorAll('img[data-src]').forEach(i => {
    if (i.dataset.started || !i.dataset.src) return;
    i.dataset.started = '1';
    i.addEventListener('load', () => i.classList.add('ok'));
    i.addEventListener('error', () => i.remove());
    i.src = i.dataset.src;
  });
}

/* ═══════════════════════ ReadinessGauge ═══════════════════════
   The same geometry as the Training Basecamp compact gauge, parameterised by
   size — one implementation, two presentations.
     0% = 12 o'clock, 25% = 3, 50% = 6, 75% = 9, sweeping CLOCKWISE.
   An SVG <circle> starts at 3 o'clock and runs clockwise, so rotating the
   group -90deg puts 0% at 12 o'clock with the direction preserved.
   The projected arc starts exactly where the achieved arc ends by offsetting
   its dash pattern by the achieved length; both use butt caps, because a round
   cap would add stroke/2 of overlap and swallow the projected sliver.
   `animate` renders at zero length so the caller can grow it to the real
   value on the next frame.                                                   */
function ReadinessGauge({ current, projected, size = 200, stroke = 14, animate = false, lead = false }) {
  const clamp = v => Math.max(0, Math.min(100, Number(v) || 0));
  const cur  = clamp(current) / 100;
  const proj = Math.max(cur, clamp(projected) / 100);

  const r = (size - stroke) / 2;
  const C = 2 * Math.PI * r;
  const c = size / 2;
  const achievedLen  = cur * C;
  const projectedLen = (proj - cur) * C;

  /* marker sits at the midpoint of the projected sliver, on the true arc */
  const midPct = (cur + proj) / 2;
  const theta  = (-90 + midPct * 360) * Math.PI / 180;
  const mx = c + r * Math.cos(theta), my = c + r * Math.sin(theta);
  const lx = c + (r + 26) * Math.cos(theta), ly = c + (r + 26) * Math.sin(theta);

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="block overflow-visible"
               role="img" aria-label="Readiness ${Math.round(current)} per cent, projected ${Math.round(projected)} per cent after the next session">
    <g transform="rotate(-90 ${c} ${c})">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="${stroke}"/>
      <circle class="arc-projected" cx="${c}" cy="${c}" r="${r}" fill="none"
              stroke="rgba(36,239,164,.34)" stroke-width="${stroke}" stroke-linecap="butt"
              stroke-dasharray="${animate ? 0 : projectedLen} ${C}" stroke-dashoffset="${-achievedLen}"
              style="opacity:${animate ? 0 : 1}"
              data-full="${projectedLen} ${C}"/>
      <circle class="arc-achieved" cx="${c}" cy="${c}" r="${r}" fill="none"
              stroke="#24EFA4" stroke-width="${stroke}" stroke-linecap="butt"
              stroke-dasharray="${animate ? 0 : achievedLen} ${C}" stroke-dashoffset="0"
              data-full="${achievedLen} ${C}"/>
    </g>
    ${lead ? `<g class="proj-lead" style="opacity:${animate ? 0 : 1}">
      <line x1="${mx}" y1="${my}" x2="${lx}" y2="${ly}" stroke="rgba(255,255,255,.5)" stroke-width="1.5" stroke-dasharray="2 3"/>
      <circle cx="${mx}" cy="${my}" r="4.5" fill="#24EFA4" stroke="#05090B" stroke-width="2"/>
    </g>` : ''}
  </svg>`;
}
/* grow every gauge on the page from zero to its real geometry */
function playGauges(root = document) {
  const arcs  = [...root.querySelectorAll('[data-full]')];
  const leads = [...root.querySelectorAll('.proj-lead')];
  if (!arcs.length) return;
  void arcs[0].getBoundingClientRect();   /* force the zero-length start to compute */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    arcs.forEach(el => { el.style.strokeDasharray = el.dataset.full; el.style.opacity = '1'; });
    leads.forEach(el => { el.style.opacity = '1'; });
  }));
}

/* ReadinessPillar — compact bar, not a doughnut; the gauge is the one circle */
function ReadinessPillar(p) {
  const weak = p.value < 50;
  return `<button data-pillar="${p.id}" class="pressable w-full panel-sub rounded-[14px] p-[12px] text-left">
    <div class="flex items-center gap-[9px]">
      <span class="${weak ? 'text-gap' : 'text-accent'}" data-icon="${p.icon}" data-size="16"></span>

/* ═══════════════ ReadinessHistory — single series, direct-labelled ═══════════════
   One scale places the line, the markers and the labels. Y ticks are the values
   the axis reaches; only the current point carries a number.                  */
let historyPeriod = '4W';
const CHART = { w: 362, h: 132, padL: 30, padR: 16, padT: 14, padB: 22 };

function historyPath(series) {
  const { w, h, padL, padR, padT, padB } = CHART;
  const iw = w - padL - padR, ih = h - padT - padB;
  const x = i => padL + (series.length === 1 ? iw / 2 : (i / (series.length - 1)) * iw);
  const y = v => padT + ih - (v / 100) * ih;
  return { x, y, iw, ih,
           pts: series.map(([lab, v], i) => ({ lab, v, cx: x(i), cy: y(v) })) };
}

function ReadinessHistory() {
  const series = READINESS.history[historyPeriod];
  const { w, h, padL, padR, padT, padB } = CHART;
  const { y, pts } = historyPath(series);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p.cx.toFixed(1)} ${p.cy.toFixed(1)}`).join(' ');
  const area = `${line} L${pts[pts.length - 1].cx.toFixed(1)} ${(h - padB).toFixed(1)} L${pts[0].cx.toFixed(1)} ${(h - padB).toFixed(1)} Z`;
  const last = pts[pts.length - 1];

  return `<section class="mt-[18px] px-[17px]">
    <div class="panel rounded-[16px] p-[13px]">
      <div class="flex items-center justify-between gap-[10px]">
        <h2 class="flex items-center gap-[7px] text-[10px] font-semibold tracking-[0.18em] text-white/70 whitespace-nowrap">
          <span class="text-accent" data-icon="bars" data-size="14"></span> READINESS HISTORY
        </h2>
        <div class="flex gap-[3px] p-[2px] rounded-full panel-sub">
          ${Object.keys(READINESS.history).map(k => `<button data-period="${k}"
            class="px-[9px] h-[21px] rounded-full text-[9.5px] font-bold transition-colors
                   ${k === historyPeriod ? 'bg-white/90 text-ink' : 'text-white/55'}">${k}</button>`).join('')}
        </div>
      </div>

      <div id="chartWrap" class="relative mt-[10px]">
        <svg viewBox="0 0 ${w} ${h}" class="w-full block" role="img"
             aria-label="Readiness over ${historyPeriod}, rising to ${last.v} per cent">
          <defs><linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#24EFA4" stop-opacity=".30"/>
            <stop offset="100%" stop-color="#24EFA4" stop-opacity="0"/>
          </linearGradient></defs>

          ${[0, 25, 50, 75, 100].map(v => `
            <line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${w - padR}" y2="${y(v).toFixed(1)}"
                  stroke="var(--grid)" stroke-width="1" fill="none"/>
            <text x="${padL - 6}" y="${(y(v) + 3.4).toFixed(1)}" text-anchor="end"
                  fill="var(--ink-3)" font-size="8.5" font-family="Inter, sans-serif">${v}%</text>`).join('')}

          <path d="${area}" fill="url(#fillGrad)" stroke="none"/>
          <path d="${line}" fill="none" stroke="#24EFA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

          ${pts.map(p => `<circle cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="3.4"
                    fill="#05090B" stroke="#24EFA4" stroke-width="2"/>`).join('')}
          <circle cx="${last.cx.toFixed(1)}" cy="${last.cy.toFixed(1)}" r="5"
                  fill="#24EFA4" stroke="#05090B" stroke-width="2"/>

          ${pts.map((p, i) => (pts.length <= 6 || i % 2 === 0 || i === pts.length - 1)
            ? `<text x="${p.cx.toFixed(1)}" y="${h - 6}" text-anchor="middle"
                     fill="var(--ink-3)" font-size="8.5" font-family="Inter, sans-serif">${p.lab}</text>` : '').join('')}

          <line id="crosshair" x1="0" y1="${padT}" x2="0" y2="${h - padB}" stroke="rgba(255,255,255,.35)"
                stroke-width="1" stroke-dasharray="3 3" fill="none" style="opacity:0"/>
        </svg>

        <div class="absolute px-[7px] py-[3px] rounded-[7px] bg-accent text-ink text-[10px] font-bold tabular-nums pointer-events-none"
             style="left:${(last.cx / w) * 100}%; top:${(last.cy / h) * 100}%; transform:translate(-62%, -168%)">${last.v}%</div>

        <div id="chartTip" class="absolute px-[8px] py-[5px] rounded-[8px] glass text-[10px] font-semibold whitespace-nowrap
                    pointer-events-none" style="opacity:0; transform:translate(-50%,-120%)"></div>
      </div>
      <p class="mt-[4px] text-[9.5px] text-white/40">Readiness recalculated weekly from logged evidence.</p>
    </div>
  </section>`;
}

/* ═══════════════════════════ RENDER ═══════════════════════════ */
function renderScreen({ animate = true } = {}) {
  const r = READINESS;

/* ══════════════════ chart hover: crosshair + tooltip ══════════════════ */
function bindChart() {
  const wrap = document.getElementById('chartWrap');
  if (!wrap) return;
  const svg = wrap.querySelector('svg');
  const cross = wrap.querySelector('#crosshair');
  const tip = wrap.querySelector('#chartTip');
  const series = READINESS.history[historyPeriod];
  const { pts } = historyPath(series);

  const move = ev => {
    const box = svg.getBoundingClientRect();
    const px = ((ev.clientX - box.left) / box.width) * CHART.w;
    let near = pts[0];
    pts.forEach(p => { if (Math.abs(p.cx - px) < Math.abs(near.cx - px)) near = p; });
    cross.setAttribute('x1', near.cx); cross.setAttribute('x2', near.cx);
    cross.style.opacity = '1';
    tip.textContent = `${near.lab} · ${near.v}%`;
    tip.style.left = `${(near.cx / CHART.w) * 100}%`;
    tip.style.top = `${(near.cy / CHART.h) * 100}%`;
    tip.style.opacity = '1';
  };
  const leave = () => { cross.style.opacity = '0'; tip.style.opacity = '0'; };
  wrap.addEventListener('pointermove', move);
  wrap.addEventListener('pointerleave', leave);
}

/* ══════════════════════════ INTERACTIONS ══════════════════════════ */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1'; t.style.transform = 'translate(-50%,0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translate(-50%,8px)'; }, 1600);
}
function startSession() {
  const btn = document.getElementById('startBtn');
  if (!btn || btn.dataset.running) return;
  btn.dataset.running = '1';
  btn.innerHTML = `${icon('clock', 13)} SESSION STARTED`;
  btn.classList.add('opacity-90');
  toast('Mountain day started · tracking elevation');
  setTimeout(() => {
    btn.innerHTML = `${icon('play', 12)} START SESSION`;
    btn.classList.remove('opacity-90'); delete btn.dataset.running;
  }, 2600);
}

document.addEventListener('click', e => {
  const t = e.target;
  const pil = t.closest('[data-pillar]');   if (pil) { openPillar(pil.dataset.pillar); return; }
  if (t.closest('[data-close-sheet]') || t.id === 'scrim') { closeSheet(); return; }

  const per = t.closest('[data-period]');
  if (per) { historyPeriod = per.dataset.period; renderScreen({ animate:false }); toast(`History · ${historyPeriod}`); return; }

  const act = t.closest('[data-act]');
  if (act) {
    e.stopPropagation();
    if (act.dataset.act === 'Start Session') { startSession(); return; }
    toast(`→ ${act.dataset.act}`);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* prototype hook — current and projected are supplied independently */
window.setReadiness = (current, projected) => {
  READINESS.current = current; READINESS.projected = projected;
  renderScreen(); return { current, projected };
};

/* ═════════════════════════════ BOOT ═════════════════════════════ */
renderScreen();
BottomNavigation();
</script>
