<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <script>
      // When loaded via the Replit path proxy (/mobile/), redirect to the
      // Expo dev subdomain where the app is served correctly at its root path.
      // expo-router's baseUrl stripping only works in production, not dev mode.
      (function () {
        var h = window.location.hostname;
        if (h.endsWith(".spock.replit.dev") && !h.includes(".expo.spock.")) {
          window.location.replace(
            "https://" + h.replace(".spock.replit.dev", ".expo.spock.replit.dev") + "/"
          );
        }
      })();
    </script>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
