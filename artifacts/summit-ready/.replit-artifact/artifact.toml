kind = "mobile"
previewPath = "/"
title = "SummitReady"
version = "1.0.0"
id = "artifacts/summit-ready"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20885

[services.development]
run = "pnpm --filter @workspace/summit-ready run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/summit-ready", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/summit-ready", "run", "serve" ]

[services.env]
PORT = "20885"
BASE_PATH = "/"
