kind = "mobile"
previewPath = "/mobile-preview.html"
title = "SummitReady"
version = "1.0.0"
id = "artifacts/summit-ready"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/mobile-preview.html"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20885

[services.development]
run = "pnpm --filter @workspace/summit-ready run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/summit-ready", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/summit-ready", "run", "serve" ]

[services.env]
PORT = "20885"
BASE_PATH = "/mobile/"
