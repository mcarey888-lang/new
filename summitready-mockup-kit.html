<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SummitReady — Screen Kit</title>

<!--
  ════════════════════════════════════════════════════════════════════════════
  SUMMITREADY MOCKUP KIT
  Shared base for every SummitReady screen mockup. Copy this file, drop the
  screen's markup into the SCREEN CONTENT region, and the style comes with it.

  ── STYLE CONTRACT ─────────────────────────────────────────────────────────
  Frame         430 x 932, radius 46, bg #05090B
  Gutters       17px everywhere; 21px for hero text blocks only
  Accent        #24EFA4        Ink #05090B
  Font          Inter — 400 / 500 / 600 / 700 / 800

  Type scale    hero title      26 / 26   bold      tracking -0.028em
                section h2      16.5 / 20 bold      tracking -0.018em
                card title      21 / 22   extrabold tracking -0.022em
                eyebrow         10.5      semibold  tracking 0.30em  UPPER
                body            12.5 / 15 regular   white/58
                meta            11.5      medium    white/58
                caption         10.5 / 12 regular   white/62
                micro           9.5 / 11  semibold

  Metrics       status bar      pt 9, time 13/16 semibold
                app bar         mt 5, 27px circle buttons, 23px segment pill
                chip            62 x 72, radius 13, gap 6, icon 24, pt 10
                wide card       297 x 167, radius 16, gap 7, pad 14
                tile            96 x 84 photo, radius 13, gap 8, text below
                strip card      full width x 76, radius 15
                bottom nav      97 tall, 36x30 tab slot, 18px active disc
                home indicator  132 x 5, bottom 12

  Surfaces      .glass    translucent pill / button  (white 7%, border 13%)
                .navglass bottom bar
                .chip-on  selected chip (accent tint + glow)
                .ph       gradient stand-in behind every photo
                .pin      map marker

  Photos        Unsplash via U('<id>'); each <img> carries data-src and is
                removed on error, leaving the .ph gradient. Never a hard fail.

  Sections      <section class="mt-[14px]"> … first section after the chips
                rhythm is roughly 12–16px between sections, 5–7px from a
                heading to its rail.
  ════════════════════════════════════════════════════════════════════════════
-->

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { ink: '#05090B', accent: '#24EFA4' },
        fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
      }
    }
  }
</script>
<style>
  body { background:#000; }
  .no-sb { -ms-overflow-style:none; scrollbar-width:none; }
  .no-sb::-webkit-scrollbar { display:none; }
  /* gradient stand-in that shows while a photo loads, or if it never does */
  .ph { background-color:#12202a; background-image:
        linear-gradient(165deg, rgba(36,239,164,.10), rgba(0,0,0,0) 48%),
        linear-gradient(to top, #070c0e 0%, #12202a 42%, #24405a 72%, #56738c 100%); }
  .ph > img { opacity:0; transition:opacity .5s ease; }
  .ph > img.ok { opacity:1; }
  .glass { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13); backdrop-filter:blur(14px); }
  .navglass { background:rgba(5,9,11,.92); backdrop-filter:blur(22px) saturate(140%); }
  .chip-on { background:rgba(36,239,164,.08); border-color:rgba(36,239,164,.65);
             box-shadow:0 0 18px -8px rgba(36,239,164,.9), inset 0 0 22px -14px rgba(36,239,164,.9); }
  .pin { position:absolute; width:21px; height:21px; margin:-10.5px 0 0 -10.5px; border-radius:9999px;
         display:grid; place-items:center; background:rgba(36,239,164,.16);
         border:1px solid rgba(36,239,164,.5); box-shadow:0 0 13px -2px rgba(36,239,164,.55); color:#24EFA4; }
</style>
</head>
<body class="font-sans text-white antialiased min-h-screen flex items-center justify-center overflow-auto">

<div class="relative w-[430px] h-[932px] bg-ink overflow-hidden sm:rounded-[46px]
            sm:shadow-[0_40px_120px_-24px_rgba(0,0,0,.9),0_0_0_10px_#0b0e10,0_0_0_11px_#232829]">

  <div id="scroll" class="absolute inset-0 overflow-y-auto no-sb">
   <div class="relative">

    <!-- Optional hero photo layer. Delete on screens without one. -->
    <div id="heroPhoto" class="absolute inset-x-0 top-0 h-[285px] ph overflow-hidden hidden">
      <img data-src="" alt="" class="w-full h-full object-cover" />
      <div class="absolute inset-0"
           style="background:linear-gradient(to bottom, rgba(5,9,11,.74) 0%, rgba(5,9,11,.26) 20%, rgba(5,9,11,.48) 52%, rgba(5,9,11,.92) 84%, #05090B 100%);"></div>
      <div class="absolute inset-0"
           style="background:linear-gradient(to right, rgba(5,9,11,.92) 0%, rgba(5,9,11,.52) 40%, rgba(5,9,11,0) 76%);"></div>
    </div>

    <div class="relative">

      <!-- ═══ STATUS BAR — identical on every screen ═══ -->
      <div class="flex items-center justify-between px-[21px] pt-[9px] select-none">
        <span class="text-[13px] leading-[16px] font-semibold tracking-[-0.01em]">9:41</span>
        <div class="flex items-center gap-[5px]">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><rect y="7.5" width="2.6" height="3.5" rx=".9"/><rect x="4.5" y="5" width="2.6" height="6" rx=".9"/><rect x="9" y="2.5" width="2.6" height="8.5" rx=".9"/><rect x="13.4" width="2.6" height="11" rx=".9"/></svg>
          <svg width="15" height="11" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.2 5.6 8.6a3.4 3.4 0 0 1 4.8 0L8 11.2Z"/><path d="M8 6.1c1.5 0 2.9.6 3.9 1.6l1.3-1.4A7.4 7.4 0 0 0 8 4.1a7.4 7.4 0 0 0-5.2 2.2l1.3 1.4A5.5 5.5 0 0 1 8 6.1Z"/><path d="M8 1.6c2.4 0 4.6 1 6.2 2.5l1.3-1.4A10.6 10.6 0 0 0 8-.4a10.6 10.6 0 0 0-7.5 3.1l1.3 1.4A8.6 8.6 0 0 1 8 1.6Z"/></svg>
          <span class="text-[10.5px] font-semibold ml-[1px]">100</span>
          <span class="relative inline-flex items-center">
            <span class="w-[21px] h-[10.5px] rounded-[3px] border border-white/45 p-[1.4px] inline-block">
              <span class="block w-full h-full rounded-[1.4px] bg-white"></span>
            </span>
            <span class="w-[1.4px] h-[4px] rounded-r bg-white/45 ml-[1px]"></span>
          </span>
        </div>
      </div>

      <!-- ═══ APP BAR — swap the right cluster per screen, keep the brand lockup ═══ -->
      <div class="mt-[5px] px-[17px] flex items-center justify-between">
        <div class="flex items-center gap-[7px]">
          <span class="text-white" data-icon="mark" data-size="21"></span>
          <span class="block leading-none">
            <span class="block text-[10.5px] font-extrabold tracking-[0.145em]">SUMMITREADY</span>
            <span class="block mt-[3px] text-[5.6px] font-semibold tracking-[0.225em] text-white/45">TRAIN MORE. GO FURTHER.</span>
          </span>
        </div>

        <div class="flex items-center gap-[6px]">
          <div id="seg" class="relative flex items-center rounded-full glass p-[2.5px]">
            <span id="segPill" class="absolute top-[2.5px] left-[2.5px] h-[23px] rounded-full bg-black/60 border border-white/10 transition-all duration-300 ease-out"></span>
            <button data-seg="training"    class="seg relative z-10 h-[23px] px-[12px] rounded-full text-[10px] font-semibold text-white transition-colors">Training</button>
            <button data-seg="expeditions" class="seg relative z-10 h-[23px] px-[12px] rounded-full text-[10px] font-semibold text-white/55 transition-colors">Expeditions</button>
          </div>
          <button class="w-[27px] h-[27px] rounded-full glass grid place-items-center text-white/85 active:scale-90 transition" aria-label="Map">
            <span data-icon="map" data-size="13"></span>
          </button>
          <button class="w-[27px] h-[27px] rounded-full glass grid place-items-center text-white/85 active:scale-90 transition" aria-label="Filters">
            <span data-icon="sliders" data-size="13"></span>
          </button>
        </div>
      </div>

      <!-- ╔══════════════════════════════════════════════════════════════════╗
           ║  SCREEN CONTENT — everything unique to this screen goes here.    ║
           ║  Use sectionHead() for headings, the metrics above for cards.    ║
           ╚══════════════════════════════════════════════════════════════════╝ -->
      <main id="screen" class="mt-[14px]"></main>

      <!-- clears the bottom nav; trim so the screen ends flush at 932 -->
      <div class="h-[101px]"></div>
    </div>
   </div>
  </div>

  <!-- ═══ BOTTOM NAV — identical on every screen; set ACTIVE_TAB ═══ -->
  <div class="absolute inset-x-0 bottom-0 h-[97px] navglass border-t border-white/[.07]">
    <div id="tabs" class="flex items-start justify-around pt-[11px]"></div>
    <div class="absolute left-1/2 -translate-x-1/2 bottom-[12px] h-[5px] w-[132px] rounded-full bg-white/90"></div>
  </div>
</div>

<script>
/* ───────────────────────────── ICONS ───────────────────────────── */
const S = (d, extra = '') =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;

const ICONS = {
  /* SummitReady mark — two overlapping peaks */
  mark:    S(`<path d="M1.5 20.5h14L8.5 7.4z"/><path d="M8.5 20.5h14l-7-16z"/>`, 'stroke-width="1.5"'),
  /* single two-peak mountain (Expeditions tab) */
  peak:    S(`<path d="M2.6 19.4h18.8L15.2 5.4l-3.8 6.8-2.8-3.6z"/>`, 'stroke-width="1.6"'),
  map:     S(`<path d="M9 4 3 6.6v13.2L9 17.2l6 2.6 6-2.6V4l-6 2.6L9 4Z"/><path d="M9 4v13.2"/><path d="M15 6.6v13.2"/>`),
  sliders: S(`<path d="M3.5 7h9.5M19 7h1.5M3.5 12h2.5M10.5 12h10M3.5 17h7.5M15.5 17h5"/><circle cx="15.8" cy="7" r="2.1"/><circle cx="8.3" cy="12" r="2.1"/><circle cx="13.3" cy="17" r="2.1"/>`),
  search:  S(`<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>`),
  x:       S(`<path d="M6 6l12 12M18 6 6 18"/>`),
  chev:    S(`<path d="m9 5 7 7-7 7"/>`),
  chevL:   S(`<path d="m15 5-7 7 7 7"/>`),
  plus:    S(`<path d="M12 5v14M5 12h14"/>`),
  bell:    S(`<path d="M18 8.6a6 6 0 1 0-12 0c0 6.4-2.4 8.2-2.4 8.2h16.8S18 15 18 8.6Z"/><path d="M13.7 20.4a2 2 0 0 1-3.4 0"/>`),
  clock:   S(`<circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3 1.8"/>`),
  calendar:S(`<rect x="3.4" y="5.2" width="17.2" height="15.4" rx="2.4"/><path d="M3.4 10h17.2M8.4 3.4v3.6M15.6 3.4v3.6"/>`),
  flame:   S(`<path d="M12 21c3.6 0 6.2-2.4 6.2-5.8 0-4.4-4.4-5.6-3.6-10.4-2.6.8-4.6 3.4-4.6 5.8 0 1.2-1 1.6-1.6 1-.6-.6-.8-1.6-.8-2.4-1.2 1.2-1.8 3.2-1.8 5.4C5.8 18.2 8.4 21 12 21Z"/>`),
  trophy:  S(`<path d="M7.2 4.4h9.6v4.8a4.8 4.8 0 0 1-9.6 0V4.4Z"/><path d="M7.2 6.2H4.8a2.4 2.4 0 0 0 2.4 3.6M16.8 6.2h2.4a2.4 2.4 0 0 1-2.4 3.6"/><path d="M12 14v3.4M8.8 20.4h6.4l-.6-3H9.4z"/>`),
  heart:   S(`<path d="M12 20.2 3.9 12.4a4.9 4.9 0 0 1 .5-7.2 4.9 4.9 0 0 1 6.6.5l1 1 1-1a4.9 4.9 0 0 1 6.6-.5 4.9 4.9 0 0 1 .5 7.2L12 20.2Z"/>`),
  star:    S(`<path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9L12 3.6Z"/>`),
  /* winding route between two waypoints */
  route:   S(`<circle cx="5.1" cy="17.7" r="1.9"/><circle cx="18.9" cy="6.3" r="1.9"/><path d="M6.7 16.9c2.8-.5 2.5-4.3 4.9-5.5s5 .2 6.1-3.2"/>`),
  /* ascending bars, solid */
  bars:    `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="14.5" width="3.6" height="5.5" rx="1.2"/><rect x="10.2" y="10" width="3.6" height="10" rx="1.2"/><rect x="16.4" y="4.8" width="3.6" height="15.2" rx="1.2"/></svg>`,
  /* crossed pickaxes */
  axes:    S(`<path d="M6.2 19.6 17.4 5.8"/><path d="M17.8 19.6 6.6 5.8"/><path d="M6.6 5.8C4.6 6.5 3.5 8 3.4 9.9"/><path d="M17.4 5.8c2 .7 3.1 2.2 3.2 4.1"/>`, 'stroke-width="1.6"'),
  /* Great Britain */
  uk:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"><path d="M13.2 2.3 L14.8 4.2 L13.9 5.6 L15.4 6.6 L14.6 8.4 L16.0 9.6 L17.2 12.0 L18.6 13.4 L16.6 15.2 L17.4 16.6 L14.6 17.6 L12.8 19.4 L9.8 21.3 L11.0 18.6 L9.2 18.0 L10.6 16.4 L8.2 15.8 L7.4 13.2 L9.6 12.2 L8.6 10.6 L10.4 9.4 L9.0 8.0 L10.8 6.8 L9.8 5.0 L11.6 4.4 Z"/></svg>`,
  /* two footprints */
  boots:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <ellipse cx="7.4" cy="7" rx="2.7" ry="4.3"/><ellipse cx="7.4" cy="15.4" rx="2.2" ry="2.2"/>
              <ellipse cx="16.6" cy="10.4" rx="2.7" ry="4.3"/><ellipse cx="16.6" cy="18.8" rx="2.2" ry="2.2"/>
            </svg>`,
  home:    S(`<path d="M3.5 10.1 12 3.4l8.5 6.7v9.5a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1v-9.5Z"/>`),
  compass: S(`<circle cx="12" cy="12" r="9"/><path d="m15.6 8.4-2 5.2-5.2 2 2-5.2 5.2-2Z"/>`, 'stroke-width="2"'),
  user:    S(`<circle cx="12" cy="7.8" r="3.7"/><path d="M4.9 20.4a7.1 7.1 0 0 1 14.2 0"/>`),
};

/* difficulty meter — three ascending bars */
const LEVELS = {
  'Moderate':         { n: 2, c: '#24EFA4' },
  'Challenging':      { n: 3, c: '#E9B949' },
  'Very Challenging': { n: 3, c: '#F0813C' },
};
function meter(label, neutral = false, h = [4, 6.5, 9]) {
  const lv = LEVELS[label] || LEVELS.Moderate;
  const col = neutral ? 'rgba(255,255,255,.8)' : lv.c;
  return `<span style="display:inline-flex;align-items:flex-end;gap:1.8px;height:${h[2]}px">` +
    h.map((hh, i) => `<span style="width:2.2px;height:${hh}px;border-radius:1.2px;background:${i < lv.n ? col : 'rgba(255,255,255,.22)'}"></span>`).join('') +
    `</span>`;
}

/* Unsplash photo url from a bare photo id */
const U = id => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=620&q=80`;

/* standard section heading, with or without the "View all" affordance */
function sectionHead(title, viewAll = true) {
  return `<div class="px-[17px] flex items-center justify-between">
    <h2 class="text-[16.5px] leading-[20px] font-bold tracking-[-0.018em]">${title}</h2>
    ${viewAll ? `<button class="flex items-center gap-[3px] text-[11.5px] font-medium text-white/58 hover:text-white transition">
      View all <span data-icon="chev" data-size="12"></span></button>` : ''}
  </div>`;
}

/* ─────────────────────────── HYDRATION ─────────────────────────── */
function icon(name, size) {
  const holder = document.createElement('span');
  holder.innerHTML = ICONS[name] || '';
  const svg = holder.firstElementChild;
  if (svg) { svg.setAttribute('width', size); svg.setAttribute('height', size); svg.style.display = 'block'; }
  return holder.innerHTML;
}
function hydrateIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(n => {
    n.innerHTML = icon(n.dataset.icon, n.dataset.size || 16);
    if (!n.classList.contains('pin')) n.style.display = 'inline-flex';
  });
}
function loadPhotos(root = document) {
  root.querySelectorAll('img[data-src]').forEach(img => {
    if (img.dataset.started || !img.dataset.src) return;
    img.dataset.started = '1';
    img.addEventListener('load', () => img.classList.add('ok'));
    img.addEventListener('error', () => img.remove());
    img.src = img.dataset.src;
  });
}

/* ────────────────────────── BOTTOM NAV ────────────────────────── */
const TABS = [
  { id: 'basecamp',    icon: 'home',    label: 'Basecamp'    },
  { id: 'explore',     icon: 'compass', label: 'Explore'     },
  { id: 'track',       icon: 'boots',   label: 'Track'       },
  { id: 'expeditions', icon: 'peak',    label: 'Expeditions' },
  { id: 'you',         icon: 'user',    label: 'You'         },
];
let activeTab = 'explore';            /* ← set to this screen's tab */

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(t => {
    const on = t.id === activeTab;
    return `<button data-tab="${t.id}" class="flex flex-col items-center w-[86px] active:scale-95 transition">
      <span class="grid place-items-center w-[36px] h-[30px] rounded-[11px] transition-colors ${on ? 'bg-accent/[.13]' : ''}">
        ${on
          ? `<span class="grid place-items-center w-[18px] h-[18px] rounded-full bg-accent text-ink" data-icon="${t.icon}" data-size="12"></span>`
          : `<span class="text-white/55" data-icon="${t.icon}" data-size="25"></span>`}
      </span>
      <span class="mt-[3px] text-[9.5px] leading-[12px] font-medium ${on ? 'text-accent' : 'text-white/55'}">${t.label}</span>
    </button>`;
  }).join('');
  hydrateIcons(el);
  el.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { activeTab = b.dataset.tab; renderTabs(); }));
}

/* ───────────────────── SEGMENTED CONTROL ───────────────────── */
function moveSeg(btn) {
  const pill = document.getElementById('segPill');
  if (!pill || !btn) return;
  pill.style.width = btn.offsetWidth + 'px';
  pill.style.transform = `translateX(${btn.offsetLeft - 2.5}px)`;
  document.querySelectorAll('.seg').forEach(b => {
    b.classList.toggle('text-white', b === btn);
    b.classList.toggle('text-white/55', b !== btn);
  });
}

/* shift + wheel scrolls a horizontal rail; plain wheel still scrolls the page */
function wheelRail(...ids) {
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('wheel', e => {
      if (e.shiftKey && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.scrollLeft += e.deltaY; e.preventDefault(); }
    }, { passive: false });
  });
}

/* ───────────────────────────── BOOT ───────────────────────────── */
/* renderScreen() is defined by the screen file; the kit calls it if present. */
if (typeof renderScreen === 'function') renderScreen();
hydrateIcons();
loadPhotos();
renderTabs();

const segs = document.querySelectorAll('.seg');
requestAnimationFrame(() => moveSeg(segs[0]));
segs.forEach(b => b.addEventListener('click', () => moveSeg(b)));
</script>
</body>
</html>
