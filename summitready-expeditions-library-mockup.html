<!--
  ════════════════════════════════════════════════════════════════════════════
  SUMMITREADY · EXPEDITIONS LIBRARY — high-fidelity interactive prototype

  The discovery surface that sits IN FRONT of the approved Expedition
  Basecamp. Five connected states in one prototype:

      A. LIBRARY   B. SEARCH / FILTER   C. DETAIL   D. STAGES   E. CREATE

  EXPEDITIONS is the active tab: this is the Expeditions section of the app,
  unlike Expedition Basecamp where Basecamp is active and the mode switch
  merely reads "Expeditions".

  ── What this prototype does NOT do ───────────────────────────────────────
  • It does not redesign the Expedition product, its persistence or schema.
    The shapes below mirror the existing engine (lib/db/src/schema/
    virtual-expedition-engine.ts): virtual_expeditions → expedition_routes →
    training_routes, joined by stable ids, with route_dna match scores and a
    data_confidence provenance value.
  • It does not duplicate mountain or route records. An expedition holds
    REFERENCES (mountainId / routeId / trainingRouteId) and every displayed
    fact is resolved from the one catalogue entry. Nothing is keyed by
    display name.
  • It does not redesign Expedition Basecamp. "Continue Expedition" and
    "Start Expedition" hand off to that approved screen — represented here
    by handoffToBasecamp(), the single seam between the two prototypes.
  • Expedition stages are REAL MOUNTAIN AND HILL CHALLENGES resolved from the
    training-route catalogue. They are never generic training phases such as
    "Base Fitness" or "Peak Phase" — those belong to the Training system.
  ════════════════════════════════════════════════════════════════════════════
-->

/* Expeditions. Note what is NOT here: no mountain name, no summit altitude, no
   route ascent, no hill data. Only references and the user's own progress. */
const EXPEDITIONS = [
  { id:'vexp_everest_lakes', routeId:'eroute_everest_sc', version:'expedition v3',
    region:'Lake District + Snowdonia', tier:'free', status:'active',

/* ════════════════════ RESOLVERS ════════════════════
   The single path from a reference to a fact. If a lookup fails the UI says
   so — it never falls back to a display name or a plausible-looking number. */
const eroute    = id  => EXPEDITION_ROUTES[id] || null;
const mountain  = exp => { const r = eroute(exp.routeId); return r ? MOUNTAINS[r.mountainId] : null; };
const troute    = id  => TRAINING_ROUTES[id] || null;
const stagesOf  = exp => exp.stages.map((s, i) => ({ ...s, n:i + 1, tr:troute(s.trainingRouteId) }))
                                   .filter(s => s.tr);
const isVerified = r => !!r && (r.dataConfidence === 'Verified' || r.dataConfidence === 'GPX_Verified');

/* Stage totals — the same reduction the engine uses (signatureStageTotals). */
function stageTotals(stages) {
  return stages.reduce((t, s) => ({
    ascentM:    t.ascentM    + Math.max(0, s.tr.ascentM    || 0),
    distanceKm: t.distanceKm + Math.max(0, s.tr.distanceKm || 0),
    hours:      t.hours      + Math.max(0, s.tr.hours      || 0),
  }), { ascentM:0, distanceKm:0, hours:0 });
}
/* Summit Match Score — the mean of the per-stage route_dna match scores, which
   is a PRESENTATION of engine output, not a second scoring system. */
const matchScore = stages => stages.length
  ? Math.round(stages.reduce((a, s) => a + s.match, 0) / stages.length) : null;
const climbedM = exp => stagesOf(exp).filter(s => s.done)
  .reduce((a, s) => a + s.tr.ascentM, 0);

/* ════════════════════ MEDIA SOURCE POLICY ════════════════════
   Imagery is deliberately indirect. A view asks for a SUBJECT; the policy
   resolves which source supplies it. Production walks the same chain:
   community Photo of the Month → approved community photo → curated/AI
   artwork → gradient fallback. Nothing here is wired to one image source, and
   swapping a source never touches a component. */
const MEDIA = {
  policy: ['community_potm', 'community', 'curated', 'fallback'],
  sources: {
    community_potm: {},                       /* none in this prototype's data */
    community:      {},
    curated: {
      everest:'mockup-assets/el-everest.jpg',        kilimanjaro:'mockup-assets/el-kilimanjaro.jpg',
      montblanc:'mockup-assets/el-montblanc.jpg',    matterhorn:'mockup-assets/el-matterhorn.jpg',
      annapurna:'mockup-assets/el-annapurna.jpg',    library:'mockup-assets/el-hero.jpg',
      custom:'mockup-assets/el-custom.jpg',
      stage1:'mockup-assets/ex-s1.jpg', stage2:'mockup-assets/ex-s2.jpg', stage3:'mockup-assets/ex-s3.jpg',
      stage4:'mockup-assets/ex-s4.jpg', stage5:'mockup-assets/ex-s5.jpg', stage6:'mockup-assets/ex-s6.jpg',
      stage7:'mockup-assets/ex-s7.jpg',
    },
  },
  resolve(subject) {
    for (const src of this.policy) {
      const hit = (this.sources[src] || {})[subject];
      if (hit) return { url:hit, source:src };
    }
    /* The gradient fallback is a real, designed state — not a broken image. */
    return { url:null, source:'fallback' };
  },
};
const CREDIT = { community_potm:'Photo of the Month', community:'Community photo', curated:'Curated artwork', fallback:'' };
</script>

  grip:   S(`<path d="M8 7h.01M8 12h.01M8 17h.01M16 7h.01M16 12h.01M16 17h.01"/>`, 'stroke-width="2.6"'),

};
function icon(n, s) {
  const h = document.createElement('span'); h.innerHTML = ICONS[n] || '';
  const g = h.firstElementChild;
  if (g) { g.setAttribute('width', s); g.setAttribute('height', s); g.style.display = 'block'; }
  return h.innerHTML;
}
function hydrateIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(n => {
    n.innerHTML = icon(n.dataset.icon, n.dataset.size || 16); n.style.display = 'inline-flex';
  });
}
function loadPhotos(root = document) {
  root.querySelectorAll('img[data-src]').forEach(i => {
    if (i.dataset.started || !i.dataset.src) return;
    i.dataset.started = '1';
    i.addEventListener('load',  () => i.classList.add('ok'));
    i.addEventListener('error', () => i.remove());       /* the gradient remains */
    i.src = i.dataset.src;
  });
}

/* ═══════════════════════ HELPERS ═══════════════════════ */
const fmt  = n => Math.round(n).toLocaleString('en-GB');
const esc  = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const hrs  = h => { const w = Math.floor(h), m = Math.round((h - w) * 60); return m ? `${w}h ${m}m` : `${w}h`; };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function niceDate(iso) {
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
/* Photo block: subject in, resolved source out, with a discreet credit. */
function Photo(subject, cls, credit = true) {
  const m = MEDIA.resolve(subject);
  /* The wrapper must be a containing block for the credit chip, but a caller
     that stretches the photo passes its own positioning. Emitting both
     `relative` and `absolute` is not a merge — Tailwind orders `.relative`
     after `.absolute`, so `relative` would silently win and collapse the
     photo to zero height. Pick one. */
  const positioned = /\b(absolute|fixed|sticky)\b/.test(cls);
  /* The credit sits top-right: the bottom of a photo is where titles and
     metadata live, and an attribution must not compete with them. */
  const c = credit && CREDIT[m.source]
    ? `<span class="absolute top-[8px] right-[9px] z-10 px-[6px] py-[2px] rounded-[5px] bg-black/40
                   text-[8px] font-semibold tracking-[.05em] text-white/55 backdrop-blur-[3px]">${CREDIT[m.source]}</span>` : '';
  return `<div class="ph ${positioned ? '' : 'relative'} overflow-hidden ${cls}">
    ${m.url ? `<img data-src="${m.url}" alt="" class="absolute inset-0 w-full h-full object-cover">` : ''}${c}</div>`;
}
function Chip(text, tone = 'neutral', ic) {
  const tones = {
    neutral:'bg-white/[.07] text-white/70 border-white/10',
    accent:'bg-accent/[.15] text-accent border-accent/30',
    warn:'bg-warn/[.13] text-warn border-warn/30',
    good:'bg-train/[.13] text-train border-train/30',
  };
  return `<span class="inline-flex items-center gap-[4px] px-[7px] py-[3px] rounded-[6px] border ${tones[tone]}
                       text-[9.5px] font-bold tracking-[.055em] uppercase whitespace-nowrap">
    ${ic ? `<span data-icon="${ic}" data-size="10"></span>` : ''}${esc(text)}</span>`;
}
/* A stat exists to be read. The label wraps rather than ellipsising, and the
   tracking tightens instead of clipping the word — at 320px a three-up row
   leaves roughly 70px of usable width per cell. */
function Stat(label, value, sub) {
  return `<div class="panel-sub rounded-[12px] px-[7px] py-[9px] min-w-0" data-stat>
    <div class="text-[8.5px] font-semibold tracking-[.05em] uppercase leading-[11px] text-white/45 break-words">${esc(label)}</div>
    <div class="mt-[3px] ${String(value).length >= 8 ? 'text-[13px]' : 'text-[14px]'} font-bold tabular-nums
                leading-[17px] truncate" data-stat-value>${value}</div>
    ${sub ? `<div class="mt-[2px] text-[9px] leading-[12px] text-white/40 break-words">${esc(sub)}</div>` : ''}</div>`;
}
/* Provenance is always shown as it is. "Estimated" is not dressed up. */
function ProvenanceChip(r) {
  if (!r) return Chip('Unresolved', 'warn', 'warn');
  return isVerified(r) ? Chip(r.dataConfidence === 'GPX_Verified' ? 'GPX verified' : 'Verified', 'accent', 'check')
                       : Chip('Unverified', 'warn', 'warn');
}

/* ═══════════════════════ CHROME ═══════════════════════ */
const TABS = [
  { id:'basecamp', icon:'home', label:'Basecamp' }, { id:'explore', icon:'compass', label:'Explore' },
  { id:'track', icon:'boots', label:'Track' }, { id:'expeditions', icon:'peak', label:'Expeditions' },
  { id:'you', icon:'user', label:'You' },
];
/* This IS the Expeditions section of the app, so Expeditions is the active tab. */
let activeTab = 'expeditions';
function BottomNavigation() {
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(t => {
    const on = t.id === activeTab;
    return `<button data-tab="${t.id}" class="flex flex-col items-center flex-1 min-w-0 active:scale-95 transition">
      <span class="grid place-items-center w-[36px] h-[30px] rounded-[11px] transition-colors ${on ? 'bg-accent/[.16]' : ''}">
        ${on ? `<span class="grid place-items-center w-[19px] h-[19px] rounded-full bg-accent text-white" data-icon="${t.icon}" data-size="12"></span>`
             : `<span class="text-white/55" data-icon="${t.icon}" data-size="24"></span>`}
      </span>
      <span class="mt-[3px] text-[9.5px] leading-[12px] font-medium truncate max-w-full px-[2px] ${on ? 'text-accent' : 'text-white/55'}">${t.label}</span>
    </button>`;
  }).join('');
  hydrateIcons(el);
  el.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.tab === 'expeditions') { go('library'); return; }
    activeTab = b.dataset.tab; BottomNavigation();
    toast(`→ ${TABS.find(t => t.id === activeTab).label}`);
  }));
}
function AppHeader(title, back) {
  return `<header class="safe-top px-[17px] pb-[12px] flex items-center gap-[11px]">
    ${back ? `<button id="backBtn" aria-label="Back"
        class="grid place-items-center w-[34px] h-[34px] rounded-full glass pressable shrink-0" data-icon="back" data-size="17"></button>` : ''}
    <div class="min-w-0 flex-1">
      ${back ? `<h1 class="text-[17px] font-extrabold leading-[21px] truncate">${esc(title)}</h1>`
             : `<div class="flex items-center gap-[8px]">
                  <img src="mockup-assets/sr-mark.png" alt="" class="w-[26px] h-[26px] object-contain">
                  <img src="mockup-assets/sr-wordmark.png" alt="SummitReady" class="h-[15px] object-contain">
                </div>`}
    </div>
    ${back ? '' : `<button class="grid place-items-center w-[34px] h-[34px] rounded-full glass pressable shrink-0"
                           aria-label="Notifications" data-icon="bell" data-size="18"></button>`}
  </header>`;
}

/* ═══════════════════════ SHEET / TOAST ═══════════════════════ */
let sheetOpen = false;
function openSheet(html, label = 'Detail') {
  const s = document.getElementById('sheet'), c = document.getElementById('scrim');
  s.className = s.className.replace(/panel|glass/g, '') + ' panel';
  s.setAttribute('aria-label', label);
  s.innerHTML = `<div class="mx-auto mb-[12px] h-[4px] w-[38px] rounded-full bg-white/22"></div>` + html;
  hydrateIcons(s); loadPhotos(s);
  c.style.opacity = '1'; c.style.pointerEvents = 'auto';
  s.style.transform = 'translate(-50%, 0)';
  sheetOpen = true;
  s.scrollTop = 0;
  return s;
}
function closeSheet() {
  const s = document.getElementById('sheet'), c = document.getElementById('scrim');
  s.style.transform = 'translate(-50%, 105%)';
  c.style.opacity = '0'; c.style.pointerEvents = 'none';
  sheetOpen = false;
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1'; t.style.transform = 'translate(-50%, 0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translate(-50%, 8px)'; }, 2100);
}
</script>

<script>
/* ═══════════════════════ UI STATE ═══════════════════════ */
const UI = {
  view:'library',            /* library · detail · stages · create */
  selected:null,             /* expedition id */
  query:'',
  filters:{ status:'all', access:'all', region:'all', difficulty:'all', maxAscent:0 },
  custom:{ name:'', mountainId:null, routeId:null, stageIds:[] },
};
const expedition = id => EXPEDITIONS.find(e => e.id === id) || null;
const current    = () => expedition(UI.selected);
const activeExp  = () => EXPEDITIONS.find(e => e.status === 'active') || null;
const regionsOf  = exp => [...new Set(stagesOf(exp).map(s => s.tr.region))];

const STATUS = {
  not_started:{ label:'Available',  tone:'neutral', cta:'Start Expedition' },
  active:     { label:'In progress',tone:'accent',  cta:'Continue Expedition' },
  completed:  { label:'Completed',  tone:'good',    cta:'View Summit' },
};

/* ═══════════════════════ FILTERING ═══════════════════════ */
function allRegions() {
  return [...new Set(EXPEDITIONS.flatMap(regionsOf))].sort();
}
function allDifficulties() {
  return [...new Set(EXPEDITIONS.map(e => (eroute(e.routeId) || {}).difficulty).filter(Boolean))];
}
function matchesQuery(exp, q) {
  if (!q) return true;
  const m = mountain(exp), r = eroute(exp.routeId);
  /* Search spans the resolved catalogue records. Matching text is how a human
     FINDS an expedition; the id is still what identifies it afterwards. */
  const hay = [
    m && m.name, m && m.country, m && m.continent, m && m.category,
    r && r.name, r && r.difficulty, exp.region, exp.tagline,
    ...stagesOf(exp).flatMap(s => [s.tr.hill, s.tr.route, s.tr.region]),
  ].filter(Boolean).join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}
function passesFilters(exp) {
  const f = UI.filters, r = eroute(exp.routeId), st = stagesOf(exp);
  if (f.status     !== 'all' && exp.status !== f.status) return false;
  if (f.access     !== 'all' && exp.tier   !== f.access) return false;
  if (f.difficulty !== 'all' && (!r || r.difficulty !== f.difficulty)) return false;
  if (f.region     !== 'all' && !regionsOf(exp).includes(f.region)) return false;
  if (f.maxAscent) { if (stageTotals(st).ascentM > f.maxAscent) return false; }
  return true;
}
const results = () => EXPEDITIONS.filter(e => matchesQuery(e, UI.query) && passesFilters(e));
const activeFilterCount = () => {
  const f = UI.filters;
  return ['status','access','region','difficulty'].filter(k => f[k] !== 'all').length + (f.maxAscent ? 1 : 0);
};

/* ═══════════════════════ A · EXPEDITIONS LIBRARY ═══════════════════════ */
function LibraryHero() {
  const n = EXPEDITIONS.length;
  return `<section class="relative">
    ${Photo('library', 'absolute inset-0', false)}
    <div class="absolute inset-0 bg-gradient-to-t from-ink via-ink/85 to-ink/45"></div>
    <div class="relative px-[17px] pt-[10px] pb-[18px]">
      <h1 class="text-[29px] font-extrabold leading-[33px] tracking-[-.02em]">Expeditions</h1>
      <p class="mt-[6px] max-w-[300px] text-[12.5px] leading-[17px] text-white/62">
        Train for a real mountain on the hills you can actually reach. Every stage is a genuine
        hill route, matched to your objective by Mountain DNA.</p>
      <div class="mt-[11px] flex flex-wrap items-center gap-[6px]">
        ${Chip(`${n} expeditions`, 'accent', 'peak')}${Chip('Custom builder', 'neutral', 'plus')}

}
function SearchBar() {

    </div>
    <button id="filterBtn" aria-label="Filters"
            class="relative grid place-items-center w-[40px] h-[40px] shrink-0 rounded-[12px] pressable
                   ${c ? 'bg-accent text-white' : 'glass text-white/75'}">
      <!-- the icon lives in its own span: hydrateIcons() replaces innerHTML, so a

      <span data-icon="sliders" data-size="18"></span>
      ${c ? `<span id="filterBadge" class="absolute -top-[3px] -right-[3px] grid place-items-center min-w-[16px] h-[16px] px-[4px]
                          rounded-full bg-white text-ink text-[9px] font-extrabold tabular-nums">${c}</span>` : ''}
    </button>

}
function QuickChips() {
  const opts = [['all','All'],['not_started','Available'],['active','In progress'],['completed','Completed']];
  return `<div class="flex gap-[7px] overflow-x-auto no-sb px-[17px] pb-[12px]">

    }).join('')}

}
/* The expedition already under way gets its own surface at the top: the
   library's job for that one is to hand you straight back to Basecamp. */
function ContinueCard() {
  const e = activeExp(); if (!e) return '';
  const m = mountain(e), st = stagesOf(e), tot = stageTotals(st);
  const climbed = climbedM(e), pct = Math.min(1, climbed / tot.ascentM);
  const next = st.find(s => !s.done);
  return `<section class="px-[17px] pb-[14px]">
    <h2 class="mb-[9px] text-[10.5px] font-bold tracking-[.2em] text-white/55">YOUR EXPEDITION</h2>

         class="panel rounded-[17px] overflow-hidden pressable">

        ${Photo(m ? m.subject : 'library', 'absolute inset-0', false)}

        <div class="absolute left-[13px] right-[13px] bottom-[10px]">

          <div class="mt-[6px] text-[18px] font-extrabold leading-[21px] truncate">${esc(m ? m.name : 'Unresolved mountain')}</div>
        </div>
      </div>
      <div class="px-[13px] pt-[11px] pb-[12px]">
        <div class="flex items-end justify-between gap-[10px]">
          <div class="min-w-0">
            <div class="text-[11px] text-white/55 truncate">${esc(st.filter(s => s.done).length)} of ${st.length} stages complete</div>
            <div class="mt-[2px] text-[13px] font-bold truncate">Next: ${esc(next ? next.tr.hill + ' · ' + next.tr.route : 'Summit')}</div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-[19px] font-extrabold tabular-nums leading-none text-accent">${Math.round(pct * 100)}%</div>
            <div class="mt-[3px] text-[9.5px] text-white/45 tabular-nums">${fmt(climbed)} / ${fmt(tot.ascentM)} m</div>
          </div>
        </div>
        <div class="mt-[10px] h-[6px] rounded-full bg-white/[.08] overflow-hidden">
          <div class="bar-fill h-full rounded-full bg-accent" style="width:0%" data-bar="${(pct * 100).toFixed(1)}"></div>
        </div>
        <button data-continue="${e.id}"
          class="mt-[12px] w-full h-[42px] rounded-[12px] bg-accent text-white text-[13px] font-bold pressable
                 flex items-center justify-center gap-[7px]">
          <span data-icon="play" data-size="13"></span> Continue Expedition

      </div>
    </div>
  </section>`;
}
function ExpeditionCard(e) {
  const m = mountain(e), r = eroute(e.routeId), st = stagesOf(e), tot = stageTotals(st);
  const ms = matchScore(st), status = STATUS[e.status];

    <div class="px-[13px] pt-[11px] pb-[12px]">

function CreateCustomCard() {

    <div class="relative px-[15px] py-[16px] flex items-center gap-[13px]">

      </div>

}
function LibraryView() {
  const list = results(), act = activeExp();

<script>
/* ═══════════════════════ E · CREATE CUSTOM EXPEDITION ═══════════════════════
   The builder assembles REFERENCES. It never writes a new mountain, a new
   route or a new hill record — it picks existing ones and orders them.

   Mountain DNA match is scored by the Route Engine, which this prototype does
   not contain. So the builder shows totals it can genuinely derive from the
   catalogue, and leaves the match PENDING rather than manufacturing a number.
   Supply a scorer through setMatchEngine() and the same UI fills in. */
const MATCH_ENGINE = {
  score: null,   /* (expeditionRouteId, trainingRouteId) => 0..100 | null */
};
const scoreStage = (rid, tid) => {
  if (typeof MATCH_ENGINE.score !== 'function') return null;
  const v = MATCH_ENGINE.score(rid, tid);
  return typeof v === 'number' && isFinite(v) ? Math.max(0, Math.min(100, Math.round(v))) : null;
};

const customStages = () => UI.custom.stageIds.map(id => troute(id)).filter(Boolean);
const customRoute  = () => eroute(UI.custom.routeId);
const customMtn    = () => UI.custom.mountainId ? MOUNTAINS[UI.custom.mountainId] : null;
function customTotals() {
  return customStages().reduce((t, tr) => ({
    ascentM:t.ascentM + tr.ascentM, distanceKm:t.distanceKm + tr.distanceKm, hours:t.hours + tr.hours,
  }), { ascentM:0, distanceKm:0, hours:0 });
}
function customMatch() {
  const r = customRoute(); if (!r) return null;
  const vals = customStages().map(tr => scoreStage(r.id, tr.id)).filter(v => v !== null);
  return vals.length === customStages().length && vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
}
function customReady() {

function StagePlanBuilder() {

      <div class="panel-sub rounded-[12px] p-[8px] flex items-center gap-[9px]">
        <span class="grid place-items-center w-[20px] h-[20px] shrink-0 rounded-full bg-accent/[.18] text-accent
                     text-[10px] font-extrabold tabular-nums">${i + 1}</span>
        ${Photo(tr.subject, 'w-[40px] h-[40px] rounded-[9px] shrink-0', false)}
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-[5px] min-w-0">
            <span class="text-[12.5px] font-bold truncate">${esc(tr.hill)}</span>

    : `<p class="mt-[10px] text-[11.5px] leading-[16px] text-white/48">

}
function MatchPending() {

    <span class="grid place-items-center w-[46px] h-[46px] shrink-0 rounded-[14px] bg-accent/[.14] text-accent"

function CreateView() {

  return AppHeader('Create Expedition', true)
  + `<section class="px-[17px] pb-[20px]">

        <label for="expName" class="block text-[10px] font-bold tracking-[.16em] text-white/45">EXPEDITION NAME</label>

}

/* ── Catalogue pickers ─────────────────────────────────────────────────── */
function pickerSheet(title, rows, onPick, placeholder) {
  const render = q => rows.filter(r => !q || r.search.includes(q.toLowerCase())).slice(0, 40);
  const html = list => list.length ? list.map(r => `
    <button data-pick="${esc(r.id)}" class="w-full panel-sub rounded-[12px] p-[9px] flex items-center gap-[10px] text-left pressable">
      ${Photo(r.subject, 'w-[44px] h-[44px] rounded-[10px] shrink-0', false)}
      <span class="min-w-0 flex-1">
        <span class="flex items-center gap-[5px] min-w-0">
          <span class="text-[13px] font-bold truncate">${esc(r.title)}</span>
          ${r.warn ? `<span class="shrink-0 text-warn" data-icon="warn" data-size="11"></span>` : ''}
        </span>
        <span class="block mt-[2px] text-[10.5px] text-white/48 truncate">${esc(r.sub)}</span>
      </span>
      <span class="shrink-0 text-accent" data-icon="plus" data-size="15"></span>
    </button>`).join('')
    : `<p class="px-[4px] py-[18px] text-center text-[12px] text-white/45">Nothing in the catalogue matches.</p>`;

  const s = openSheet(`
    <div class="flex items-center justify-between">
      <h2 class="text-[17px] font-extrabold">${esc(title)}</h2>
      <button id="sheetClose" aria-label="Close" class="grid place-items-center w-[30px] h-[30px] rounded-full glass pressable"
              data-icon="close" data-size="14"></button>
    </div>
    <div class="relative mt-[12px]">
      <span class="absolute left-[11px] top-1/2 -translate-y-1/2 text-white/40" data-icon="search" data-size="15"></span>
      <input id="pq" type="text" placeholder="${esc(placeholder)}" autocomplete="off" aria-label="${esc(placeholder)}"
             class="w-full panel-sub rounded-[12px] pl-[33px] pr-[12px] py-[10px] text-[12.5px] font-medium
                    focus:outline-none focus:border-accent/45">
    </div>
    <div id="pickList" class="mt-[11px] grid gap-[7px]">${html(render(''))}</div>`, title);
  document.getElementById('sheetClose').onclick = closeSheet;
  const listEl = document.getElementById('pickList');
  const bind = () => {
    hydrateIcons(listEl); loadPhotos(listEl);
    listEl.querySelectorAll('[data-pick]').forEach(b =>
      b.addEventListener('click', () => { onPick(b.dataset.pick); }));
  };
  bind();
  document.getElementById('pq').addEventListener('input', ev => {
    listEl.innerHTML = html(render(ev.target.value.trim())); bind();
  });
}
function openMountainPicker() {
  pickerSheet('Choose a mountain', Object.values(MOUNTAINS).map(m => ({
    id:m.id, title:m.name, sub:`${m.country} · ${fmt(m.summitM)} m · ${m.category}`,
    subject:m.subject, warn:false, search:`${m.name} ${m.country} ${m.continent} ${m.category}`.toLowerCase(),
  })), id => {
    UI.custom.mountainId = id;
    UI.custom.routeId = null;                    /* a route belongs to one mountain */
    closeSheet(); render(); toast(MOUNTAINS[id].name + ' selected');
  }, 'Search the mountain catalogue');
}
function openRoutePicker() {
  const mId = UI.custom.mountainId; if (!mId) return;
  const rows = Object.values(EXPEDITION_ROUTES).filter(r => r.mountainId === mId).map(r => ({
    id:r.id, title:r.name, sub:`${fmt(r.ascentM)} m ascent · ${r.distanceKm.toFixed(1)} km · ${r.dataConfidence}`,
    subject:MOUNTAINS[mId].subject, warn:!isVerified(r), search:`${r.name} ${r.difficulty}`.toLowerCase(),
  }));
  pickerSheet('Choose a route', rows, id => {
    UI.custom.routeId = id; closeSheet(); render();
    const r = eroute(id);
    toast(isVerified(r) ? r.name + ' selected' : r.name + ' — verification in progress');
  }, 'Search routes on this mountain');
}
function openStagePicker() {
  const chosen = new Set(UI.custom.stageIds);
  const rows = Object.values(TRAINING_ROUTES).filter(t => !chosen.has(t.id)).map(t => ({
    id:t.id, title:`${t.hill} · ${t.route}`,
    sub:`${t.region} · ${fmt(t.ascentM)} m · ${t.distanceKm.toFixed(1)} km · ${hrs(t.hours)}`,
    subject:t.subject, warn:!isVerified(t), search:`${t.hill} ${t.route} ${t.region}`.toLowerCase(),
  }));
  pickerSheet('Add a stage', rows, id => {
    UI.custom.stageIds.push(id); closeSheet(); render();
    toast(troute(id).hill + ' added as stage ' + UI.custom.stageIds.length);
  }, 'Search hills, routes and regions');
}
</script>

<script>
/* ═══════════════════════ THE BASECAMP SEAM ═══════════════════════
   The one place this prototype hands over. Expedition Basecamp is an approved,
   separate master: the library never renders it, never re-implements its
   Progress Mountain, and never redefines its progress maths. It passes an
   expedition id and stands aside. */
function handoffToBasecamp(expId, note) {
  const e = expedition(expId), m = e ? mountain(e) : null;
  toast(note || `→ Expedition Basecamp · ${m ? m.name : expId}`);
}

/* ═══════════════════════ ACTIONS ═══════════════════════ */
function primaryAction(e) {
  const r = eroute(e.routeId);
  const locked  = e.tier === 'premium' && !ENTITLEMENT.premium;
  const blocked = !isVerified(r);
  if (blocked) return { label:'Verification in progress', icon:'warn',  disabled:true };
  if (locked)  return { label:'Unlock with Premium',      icon:'lock',  disabled:false, upgrade:true };
  return { label:STATUS[e.status].cta,
           icon:e.status === 'completed' ? 'trophy' : 'play', disabled:false };
}
function ActionBar() {
  const el = document.getElementById('actionBar');
  let html = '';
  if (UI.view === 'detail' || UI.view === 'stages') {
    const e = current();
    if (e) {
      const a = primaryAction(e);
      html = `<div class="px-[17px] pt-[10px] pb-[11px] navglass border-t border-white/[.07]">
        <div class="flex gap-[9px]">
          <button id="secondary" class="w-[46px] h-[46px] shrink-0 grid place-items-center rounded-[13px] glass pressable"
                  aria-label="${UI.view === 'detail' ? 'View stages' : 'Back to overview'}"
                  data-icon="${UI.view === 'detail' ? 'route' : 'info'}" data-size="19"></button>
          <button id="primary" ${a.disabled ? 'disabled aria-disabled="true"' : ''}
            class="flex-1 h-[46px] rounded-[13px] text-[13.5px] font-bold pressable flex items-center justify-center gap-[8px]
                   ${a.disabled ? 'bg-white/[.07] text-white/40 cursor-not-allowed' : 'bg-accent text-white'}">
            <span data-icon="${a.icon}" data-size="15"></span> ${esc(a.label)}</button>
        </div>
      </div>`;
    }
  } else if (UI.view === 'create') {
    const st = customReady();
    html = `<div class="px-[17px] pt-[10px] pb-[11px] navglass border-t border-white/[.07]">
      <button id="createExp" ${st.ok ? '' : 'disabled aria-disabled="true"'}
        class="w-full h-[46px] rounded-[13px] text-[13.5px] font-bold pressable flex items-center justify-center gap-[8px]
               ${st.ok ? 'bg-accent text-white' : 'bg-white/[.07] text-white/40 cursor-not-allowed'}">
        <span data-icon="${st.ok ? 'flag' : 'lock'}" data-size="15"></span>
        ${st.ok ? 'Create Expedition' : 'Complete the checklist'}</button>
    </div>`;
  }
  el.innerHTML = html;
  hydrateIcons(el);
  if (UI.view === 'detail' || UI.view === 'stages') {
    const e = current(), a = e && primaryAction(e);
    const sec = document.getElementById('secondary'), pri = document.getElementById('primary');
    if (sec) sec.onclick = () => go(UI.view === 'detail' ? 'stages' : 'detail');
    if (pri && a && !a.disabled) pri.onclick = () => {
      if (a.upgrade) { toast('→ Premium'); return; }
      if (e.status === 'active')    { handoffToBasecamp(e.id); return; }
      if (e.status === 'completed') { handoffToBasecamp(e.id, '→ Summit · ' + (mountain(e) || {}).name); return; }
      confirmStart(e);
    };
  }
  if (UI.view === 'create') {
    const b = document.getElementById('createExp');
    if (b && !b.disabled) b.onclick = createCustomExpedition;
  }
  sizeSpacer();
}
/* One stack holds the action bar and the navigation, so neither can cover the
   other. The spacer is measured from the real rendered height. */
function sizeSpacer() {
  requestAnimationFrame(() => {
    const h = document.getElementById('bottomStack').offsetHeight;
    document.getElementById('spacer').style.height = (h + 14) + 'px';
  });
}

function confirmStart(e) {
  const m = mountain(e), r = eroute(e.routeId), st = stagesOf(e), tot = stageTotals(st);
  openSheet(`
    <div class="flex items-start justify-between gap-[10px]">
      <div class="min-w-0">
        <div class="text-[10px] font-bold tracking-[.16em] text-accent">START EXPEDITION</div>
        <h2 class="mt-[4px] text-[20px] font-extrabold leading-[24px] truncate">${esc(m ? m.name : '—')}</h2>
        <div class="mt-[2px] text-[12px] text-white/60 truncate">${esc(r ? r.name : '—')}</div>
      </div>
      <button id="sheetClose" aria-label="Close" class="shrink-0 grid place-items-center w-[30px] h-[30px] rounded-full glass pressable"
              data-icon="close" data-size="14"></button>
    </div>
    <div class="mt-[13px] grid grid-cols-3 gap-[7px]">
      ${Stat('Stages', st.length)}${Stat('Ascent', fmt(tot.ascentM) + ' m')}${Stat('Window', e.weeks + ' wks')}
    </div>
    <p class="mt-[12px] text-[12px] leading-[17px] text-white/62">
      This becomes your active expedition. Your progress is tracked in Expedition Basecamp, and every stage
      you walk is recorded as a normal activity &mdash; nothing about how you track changes.</p>
    ${activeExp() && activeExp().id !== e.id ? `
      <div class="mt-[12px] rounded-[12px] border border-warn/35 bg-warn/[.07] p-[11px] flex items-start gap-[8px]">
        <span class="mt-[1px] shrink-0 text-warn" data-icon="warn" data-size="14"></span>
        <p class="text-[11.5px] leading-[16px] text-white/70">
          <strong class="text-warn">${esc((mountain(activeExp()) || {}).name || 'An expedition')}</strong> is already
          under way. Its progress is kept &mdash; you can return to it at any time.</p>
      </div>` : ''}
    <div class="mt-[16px] flex gap-[9px]">
      <button id="cancelStart" class="flex-1 h-[44px] rounded-[12px] glass text-[13px] font-bold pressable">Not yet</button>
      <button id="doStart" class="flex-[1.6] h-[44px] rounded-[12px] bg-accent text-white text-[13px] font-bold pressable
                                  flex items-center justify-center gap-[7px]">
        <span data-icon="play" data-size="13"></span> Start Expedition</button>
    </div>`, 'Start expedition');
  document.getElementById('sheetClose').onclick  = closeSheet;
  document.getElementById('cancelStart').onclick = closeSheet;
  document.getElementById('doStart').onclick = () => {
    EXPEDITIONS.forEach(x => { if (x.status === 'active') x.status = 'not_started'; });
    e.status = 'active';
    e.startedOn = new Date().toISOString().slice(0, 10);
    closeSheet(); render();
    handoffToBasecamp(e.id);
  };
}

function createCustomExpedition() {
  const st = customReady(); if (!st.ok) { toast('Complete the checklist first'); return; }
  const r = customRoute(), m = customMtn();
  const id = 'vexp_custom_' + Math.random().toString(36).slice(2, 8);
  const exp = {
    id, routeId:r.id, version:'custom v1', custom:true,
    region:[...new Set(customStages().map(t => t.region))].join(' + '),
    tier:'free', status:'not_started', weeks:Math.max(8, customStages().length * 2),
    name:UI.custom.name.trim() || `${m.name} Simulation`,
    tagline:'Built by you.',
    blurb:`Your own stage plan for ${m.name} via ${r.name}, assembled from ${customStages().length} hill routes in the catalogue.`,
    stages:customStages().map((t, i) => ({
      trainingRouteId:t.id, match:scoreStage(r.id, t.id), role:i === customStages().length - 1 ? 'Final push' : `Stage ${i + 1}`, done:false,
    })),
  };
  EXPEDITIONS.unshift(exp);
  UI.custom = { name:'', mountainId:null, routeId:null, stageIds:[] };
  UI.selected = id;
  go('detail');
  toast('Expedition created · ' + exp.name);
}

/* ═══════════════════════ RENDER + NAVIGATION ═══════════════════════ */
const VIEWS = { library:LibraryView, detail:DetailView, stages:StagesView, create:CreateView };
function go(view, id) {
  if (id) UI.selected = id;
  UI.view = view;
  if (sheetOpen) closeSheet();
  render();
  window.scrollTo({ top:0, behavior:'instant' in window ? 'instant' : 'auto' });
}
function render() {
  const el = document.getElementById('screen');
  el.innerHTML = (VIEWS[UI.view] || LibraryView)();
  hydrateIcons(el); loadPhotos(el);
  bindScreen(el);
  ActionBar();
  BottomNavigation();
  /* Arcs and bars need a computed zero before they animate to their value. */
  const arcs = [...el.querySelectorAll('[data-full]')], bars = [...el.querySelectorAll('[data-bar]')];
  if (arcs.length || bars.length) {
    void el.getBoundingClientRect();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      arcs.forEach(a => { a.style.strokeDasharray = a.dataset.full; });
      bars.forEach(b => { b.style.width = b.dataset.bar + '%'; });
    }));
  }
}
function bindScreen(el) {
  const on = (sel, ev, fn) => el.querySelectorAll(sel).forEach(n => n.addEventListener(ev, fn));

  const back = document.getElementById('backBtn');
  if (back) back.onclick = () => go(UI.view === 'stages' ? 'detail' : 'library');

  /* Library */
  on('[data-open]', 'click', ev => {
    if (ev.target.closest('[data-continue]')) return;
    go('detail', ev.currentTarget.dataset.open);
  });
  on('[data-open]', 'keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go('detail', ev.currentTarget.dataset.open); }
  });
  on('[data-continue]', 'click', ev => { ev.stopPropagation(); handoffToBasecamp(ev.currentTarget.dataset.continue); });
  on('[data-create]', 'click', () => go('create'));
  on('[data-quick]', 'click', ev => { UI.filters.status = ev.currentTarget.dataset.quick; render(); });

  const q = document.getElementById('q');
  if (q) {
    q.addEventListener('input', ev => {
      UI.query = ev.target.value;
      const pos = ev.target.selectionStart;
      render();
      const nq = document.getElementById('q');
      if (nq) { nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (_) {} }
    });
  }
  const qc = document.getElementById('qClear');
  if (qc) qc.onclick = () => { UI.query = ''; render(); };
  const fb = document.getElementById('filterBtn');
  if (fb) fb.onclick = openFilterSheet;
  const rf = document.getElementById('resetFilters');
  if (rf) rf.onclick = () => { UI.filters = { status:'all', access:'all', region:'all', difficulty:'all', maxAscent:0 }; render(); };

  /* Detail */
  const vs = document.getElementById('viewStages');
  if (vs) vs.onclick = () => go('stages');
  const up = document.getElementById('upgrade');
  if (up) up.onclick = () => toast('→ Premium');

  /* Stages */
  on('[data-stage]', 'click', ev => StageSheet(ev.currentTarget.dataset.stage, current()));
  on('[data-stage]', 'keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); StageSheet(ev.currentTarget.dataset.stage, current()); }
  });

  /* Create */
  const pm = document.getElementById('pickMountain'); if (pm) pm.onclick = openMountainPicker;
  const pr = document.getElementById('pickRoute');    if (pr && !pr.disabled) pr.onclick = openRoutePicker;
  const as = document.getElementById('addStage');     if (as) as.onclick = openStagePicker;
  const nm = document.getElementById('expName');
  if (nm) nm.addEventListener('input', ev => { UI.custom.name = ev.target.value; });
  on('[data-move]', 'click', ev => {
    const i = +ev.currentTarget.dataset.i, dir = ev.currentTarget.dataset.move === 'up' ? -1 : 1;
    const a = UI.custom.stageIds, j = i + dir;
    if (j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]]; render();
  });
  on('[data-remove]', 'click', ev => {
    const i = +ev.currentTarget.dataset.remove;
    const [gone] = UI.custom.stageIds.splice(i, 1);
    render(); toast((troute(gone) || {}).hill + ' removed');
  });
}
function openFilterSheet() {
  openSheet(FilterSheet(), 'Filter expeditions');
  const s = document.getElementById('sheet');
  document.getElementById('sheetClose').onclick = closeSheet;
  const refresh = () => {
    const c = document.getElementById('fCount'); if (c) c.textContent = results().length;
  };
  s.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
    UI.filters[b.dataset.f] = b.dataset.v;
    openFilterSheet();                 /* re-render the sheet in place */
  }));
  const rng = document.getElementById('ascRange');
  rng.addEventListener('input', ev => {
    UI.filters.maxAscent = +ev.target.value;
    document.getElementById('ascLabel').textContent = UI.filters.maxAscent ? fmt(UI.filters.maxAscent) + ' m' : 'Any';
    refresh();
  });
  document.getElementById('fReset').onclick = () => {
    UI.filters = { status:'all', access:'all', region:'all', difficulty:'all', maxAscent:0 };
    openFilterSheet();
  };
  document.getElementById('fApply').onclick = () => { closeSheet(); render(); toast(results().length + ' expeditions'); };
}

/* ═══════════════════════ QA HOOKS ═══════════════════════ */
window.setExpeditionView = v => {
  if (!VIEWS[v]) return null;
  if ((v === 'detail' || v === 'stages') && !UI.selected) UI.selected = EXPEDITIONS[0].id;
  go(v); return v;
};
window.setExpeditionStatus = (id, status) => {
  const e = expedition(id); if (!e || !STATUS[status]) return null;
  if (status === 'active') EXPEDITIONS.forEach(x => { if (x.id !== id && x.status === 'active') x.status = 'not_started'; });
  e.status = status;
  e.stages.forEach(s => { s.done = status === 'completed'; });
  render(); return status;
};
window.setCustomStageCount = n => {
  const pool = Object.values(TRAINING_ROUTES).filter(t => isVerified(t)).map(t => t.id);
  UI.custom.stageIds = pool.slice(0, Math.max(0, Math.min(pool.length, n | 0)));
  if (UI.view === 'create') render();
  return UI.custom.stageIds.length;
};
window.selectExpedition = id => { if (!expedition(id)) return null; UI.selected = id; render(); return id; };
window.setEntitlement    = p => { ENTITLEMENT.premium = !!p; render(); return ENTITLEMENT.premium; };
window.setMatchEngine    = fn => { MATCH_ENGINE.score = typeof fn === 'function' ? fn : null; render(); return !!MATCH_ENGINE.score; };
window.setFilter = (k, v) => {
  if (!(k in UI.filters)) return null;
  UI.filters[k] = k === 'maxAscent' ? +v : v; render(); return UI.filters[k];
};
window.setQuery = q => { UI.query = String(q || ''); render(); return UI.query; };
window.__state = () => ({ view:UI.view, selected:UI.selected, query:UI.query,
  filters:{ ...UI.filters }, results:results().map(e => e.id), custom:{ ...UI.custom } });

/* ═══════════════════════ BOOT ═══════════════════════ */
document.getElementById('scrim').addEventListener('click', closeSheet);
window.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen) closeSheet(); });
window.addEventListener('resize', sizeSpacer);
render();
</script>
</body>
