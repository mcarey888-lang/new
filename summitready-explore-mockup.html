<script>
/* ───────────────────────────── ICONS ───────────────────────────── */
const S = (d, extra = '') =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;

const ICONS = {
  /* SummitReady mark — two overlapping peaks */

  /* single two-peak mountain (Expeditions tab) */

  sliders: S(`<path d="M3.5 7h9.5M19 7h1.5M3.5 12h2.5M10.5 12h10M3.5 17h7.5M15.5 17h5"/><circle cx="15.8" cy="7" r="2.1"/><circle cx="8.3" cy="12" r="2.1"/><circle cx="13.3" cy="17" r="2.1"/>`),
  search:  S(`<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>`),
  x:       S(`<path d="M6 6l12 12M18 6 6 18"/>`),
  chev:    S(`<path d="m9 5 7 7-7 7"/>`),
  heart:   S(`<path d="M12 20.2 3.9 12.4a4.9 4.9 0 0 1 .5-7.2 4.9 4.9 0 0 1 6.6.5l1 1 1-1a4.9 4.9 0 0 1 6.6-.5 4.9 4.9 0 0 1 .5 7.2L12 20.2Z"/>`),
  star:    S(`<path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9L12 3.6Z"/>`),
  /* winding route between two waypoints */
  route:   S(`<circle cx="5.1" cy="17.7" r="1.9"/><circle cx="18.9" cy="6.3" r="1.9"/><path d="M6.7 16.9c2.8-.5 2.5-4.3 4.9-5.5s5 .2 6.1-3.2"/>`),
  /* ascending bars, solid */
  bars:    `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="14.5" width="3.6" height="5.5" rx="1.2"/><rect x="10.2" y="10" width="3.6" height="10" rx="1.2"/><rect x="16.4" y="4.8" width="3.6" height="15.2" rx="1.2"/></svg>`,
  /* crossed pickaxes */
  axes:    S(`<path d="M6.2 19.6 17.4 5.8"/><path d="M17.8 19.6 6.6 5.8"/><path d="M6.6 5.8C4.6 6.5 3.5 8 3.4 9.9"/><path d="M17.4 5.8c2 .7 3.1 2.2 3.2 4.1"/>`, 'stroke-width="1.6"'),
  /* Great Britain + Ireland */
  uk:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"><path d="M13.2 2.3 L14.8 4.2 L13.9 5.6 L15.4 6.6 L14.6 8.4 L16.0 9.6 L17.2 12.0 L18.6 13.4 L16.6 15.2 L17.4 16.6 L14.6 17.6 L12.8 19.4 L9.8 21.3 L11.0 18.6 L9.2 18.0 L10.6 16.4 L8.2 15.8 L7.4 13.2 L9.6 12.2 L8.6 10.6 L10.4 9.4 L9.0 8.0 L10.8 6.8 L9.8 5.0 L11.6 4.4 Z"/></svg>`,
  /* two footprints */
  boots:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <ellipse cx="7.4" cy="7" rx="2.7" ry="4.3"/><ellipse cx="7.4" cy="15.4" rx="2.2" ry="2.2"/>
              <ellipse cx="16.6" cy="10.4" rx="2.7" ry="4.3"/><ellipse cx="16.6" cy="18.8" rx="2.2" ry="2.2"/>
            </svg>`,
  home:    S(`<path d="M3.5 10.1 12 3.4l8.5 6.7v9.5a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1v-9.5Z"/>`),
  compass: S(`<circle cx="12" cy="12" r="9"/><path d="m15.6 8.4-2 5.2-5.2 2 2-5.2 5.2-2Z"/>`, 'stroke-width="2"'),
  user:    S(`<circle cx="12" cy="7.8" r="3.7"/><path d="M4.9 20.4a7.1 7.1 0 0 1 14.2 0"/>`),
};

/* difficulty meter — three ascending bars */
const LEVELS = {
  'Moderate':         { n: 2, c: '#24EFA4' },
  'Challenging':      { n: 3, c: '#E9B949' },
  'Very Challenging': { n: 3, c: '#F0813C' },
};
function meter(label, neutral = false, h = [4, 6.5, 9]) {
  const lv = LEVELS[label] || LEVELS.Moderate;
  const col = neutral ? 'rgba(255,255,255,.8)' : lv.c;
  return `<span style="display:inline-flex;align-items:flex-end;gap:1.8px;height:${h[2]}px">` +
    h.map((hh, i) => `<span style="width:2.2px;height:${hh}px;border-radius:1.2px;background:${i < lv.n ? col : 'rgba(255,255,255,.22)'}"></span>`).join('') +
    `</span>`;
}

/* ───────────────────────────── DATA ───────────────────────────── */
const U = id => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=620&q=80`;

const CHIPS = [
  { id: 'all',      icon: 'mark',  label: 'All',                count: '1,200+' },
  { id: 'europe',   icon: 'mark',  label: 'Europe',             count: '428'    },

  { id: 'classic',  icon: 'route', label: 'Classic\nRoutes'                     },
  { id: 'beginner', icon: 'bars',  label: 'Beginner\nFriendly'                  },
  { id: 'tech',     icon: 'axes',  label: 'Technical'                           },
];

const FEATURED = [
  { name: 'Mont Blanc',  alt: '4,808 m', place: 'France / Italy', badge: 'FEATURED',
    diff: 'Challenging', img: U('1506905925346-21bda4d32df4') },
  { name: 'Kilimanjaro', alt: '5,895 m', place: 'Tanzania',
    diff: 'Challenging', img: U('1519681393784-d120267933ba') },
  { name: 'Matterhorn',  alt: '4,478 m', place: 'Switzerland',
    diff: 'Very Challenging', img: U('1470071459604-3b5ec3a7fe05') },
];

const POPULAR = [
  { name: 'Ben Nevis',  alt: '1,345 m', diff: 'Moderate',         img: U('1483728642387-6c3bdd6c93e5'), fav: false },
  { name: 'Tryfan',     alt: '918 m',   diff: 'Challenging',      img: U('1454496522488-7a8e488e8606'), fav: false },
  { name: 'Snowdon',    alt: '1,085 m', diff: 'Moderate',         img: U('1439853949127-fa647821eba0'), fav: false },
  { name: 'Matterhorn', alt: '4,478 m', diff: 'Very Challenging', img: U('1501785888041-af3ef285b470'), fav: false },
];

const TABS = [
  { id: 'basecamp',    icon: 'home',    label: 'Basecamp'    },
  { id: 'explore',     icon: 'compass', label: 'Explore'     },
  { id: 'track',       icon: 'boots',   label: 'Track'       },
  { id: 'expeditions', icon: 'peak',    label: 'Expeditions' },
  { id: 'you',         icon: 'user',    label: 'You'         },
];

/* ─────────────────────────── HYDRATION ─────────────────────────── */
function icon(name, size) {
  const holder = document.createElement('span');
  holder.innerHTML = ICONS[name] || '';
  const svg = holder.firstElementChild;
  if (svg) { svg.setAttribute('width', size); svg.setAttribute('height', size); svg.style.display = 'block'; }
  return holder.innerHTML;
}
function hydrateIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(n => {
    n.innerHTML = icon(n.dataset.icon, n.dataset.size || 16);
    if (!n.classList.contains('pin')) n.style.display = 'inline-flex';
  });
}
function loadPhotos(root = document) {
  root.querySelectorAll('img[data-src]').forEach(img => {
    if (img.dataset.started) return;
    img.dataset.started = '1';
    img.addEventListener('load', () => img.classList.add('ok'));
    img.addEventListener('error', () => img.remove());
    img.src = img.dataset.src;
  });
}

/* ──────────────────────────── RENDER ──────────────────────────── */
let activeChip = 'all', activeTab = 'explore', query = '';

function renderChips() {
  const el = document.getElementById('chips');
  el.innerHTML = CHIPS.map(c => {
    const on = c.id === activeChip;
    return `<button data-chip="${c.id}"
      class="shrink-0 w-[62px] h-[72px] rounded-[13px] border flex flex-col items-center pt-[10px] px-[3px]
             transition-all duration-200 active:scale-[.96]
             ${on ? 'chip-on' : 'bg-white/[.035] border-white/[.085] hover:bg-white/[.06]'}">
      <span class="${on ? 'text-accent' : 'text-white/85'}" data-icon="${c.icon}" data-size="24"></span>
      <span class="mt-[4px] block text-center text-[9.5px] font-semibold leading-[11px] whitespace-pre-line
                   ${on ? 'text-accent' : 'text-white/88'}">${c.label}</span>
      ${c.count ? `<span class="mt-[1px] block text-[10px] leading-[11px] text-white/42">${c.count}</span>` : ''}
    </button>`;
  }).join('');
  hydrateIcons(el);
}

function featuredCard(m) {
  return `<article class="shrink-0 w-[297px] h-[167px] rounded-[16px] overflow-hidden relative ph border border-white/[.08] cursor-pointer group">
    <img data-src="${m.img}" alt="${m.name}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-[1.04]" />
    <div class="absolute inset-0" style="background:linear-gradient(to top, rgba(5,9,11,.94) 0%, rgba(5,9,11,.62) 34%, rgba(5,9,11,.05) 68%, rgba(5,9,11,.3) 100%);"></div>
    ${m.badge ? `<span class="absolute top-[11px] left-[11px] px-[8px] py-[4px] rounded-[6px] bg-black/60 border border-white/12 backdrop-blur-md text-[8px] font-bold tracking-[0.14em]">${m.badge}</span>` : ''}
    <button class="absolute right-[13px] bottom-[50px] w-[30px] h-[30px] rounded-full border border-accent/80 bg-accent/10 backdrop-blur-sm grid place-items-center text-accent active:scale-90 transition">
      <span data-icon="chev" data-size="13"></span>
    </button>
    <div class="absolute left-[14px] right-[14px] bottom-[14px]">
      <h3 class="text-[21px] leading-[22px] font-extrabold tracking-[-0.022em]">${m.name}</h3>
      <p class="mt-[3px] text-[12px] leading-[14px] text-white/72">${m.alt} &nbsp;•&nbsp; ${m.place}</p>
      <div class="mt-[6px] flex items-center gap-[14px] text-[10.5px] leading-[13px] text-white/72">
        <span class="flex items-center gap-[5px]">${meter(m.diff, true)} ${m.diff}</span>
        <span class="flex items-center gap-[5px]"><span data-icon="route" data-size="12"></span> Multiple routes</span>
        <span class="flex items-center gap-[5px]"><span data-icon="star" data-size="12"></span> Popular</span>
      </div>
    </div>
  </article>`;
}

function popularCard(m, i) {
  return `<article class="shrink-0 w-[96px] cursor-pointer group">
    <div class="relative w-[96px] h-[84px] rounded-[13px] overflow-hidden ph border border-white/[.07]">
      <img data-src="${m.img}" alt="${m.name}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-[1.06]" />
      <div class="absolute inset-0" style="background:linear-gradient(to top, rgba(5,9,11,.5) 0%, rgba(5,9,11,0) 45%);"></div>
      <button data-fav="${i}" class="fav absolute top-[6px] right-[6px] w-[21px] h-[21px] rounded-full bg-black/45 border border-white/15 backdrop-blur-md grid place-items-center active:scale-90 transition ${m.fav ? 'text-accent' : 'text-white/90'}">
        <span data-icon="heart" data-size="11"></span>
      </button>
    </div>
    <h3 class="mt-[2px] text-[11px] leading-[13px] font-bold tracking-[-0.01em]">${m.name}</h3>
    <p class="mt-[3px] text-[10.5px] leading-[12px] text-white/62">${m.alt}</p>
    <div class="mt-[1px] flex items-center gap-[4px] text-[9.5px] leading-[11px] text-white/62">${meter(m.diff)} ${m.diff}</div>
  </article>`;
}

function renderLists() {
  const q = query.trim().toLowerCase();
  const hit = m => !q || m.name.toLowerCase().includes(q) || (m.place || '').toLowerCase().includes(q);

  const fEl = document.getElementById('featured'), pEl = document.getElementById('popular');
  const f = FEATURED.filter(hit);
  fEl.innerHTML = f.map(featuredCard).join('');
  pEl.innerHTML = POPULAR.map((m, i) => (hit(m) ? popularCard(m, i) : '')).join('');
  document.getElementById('empty').classList.toggle('hidden', f.length + POPULAR.filter(hit).length > 0);

  [fEl, pEl].forEach(el => { hydrateIcons(el); loadPhotos(el); });

  pEl.querySelectorAll('.fav').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    const m = POPULAR[+btn.dataset.fav];
    m.fav = !m.fav;
    btn.classList.toggle('text-accent', m.fav);
    btn.classList.toggle('text-white/90', !m.fav);
    btn.querySelector('svg').setAttribute('fill', m.fav ? 'currentColor' : 'none');
  }));
}

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(t => {
    const on = t.id === activeTab;
    return `<button data-tab="${t.id}" class="flex flex-col items-center w-[86px] active:scale-95 transition">
      <span class="grid place-items-center w-[36px] h-[30px] rounded-[11px] transition-colors ${on ? 'bg-accent/[.13]' : ''}">
        ${on
          ? `<span class="grid place-items-center w-[18px] h-[18px] rounded-full bg-accent text-ink" data-icon="${t.icon}" data-size="12"></span>`
          : `<span class="text-white/55" data-icon="${t.icon}" data-size="25"></span>`}
      </span>
      <span class="mt-[3px] text-[9.5px] leading-[12px] font-medium ${on ? 'text-accent' : 'text-white/55'}">${t.label}</span>
    </button>`;
  }).join('');
  hydrateIcons(el);
  el.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { activeTab = b.dataset.tab; renderTabs(); }));
}

function moveSeg(btn) {
  const pill = document.getElementById('segPill');
  pill.style.width = btn.offsetWidth + 'px';
  pill.style.transform = `translateX(${btn.offsetLeft - 2.5}px)`;
  document.querySelectorAll('.seg').forEach(b => {
    b.classList.toggle('text-white', b === btn);
    b.classList.toggle('text-white/55', b !== btn);
  });
}

/* ───────────────────────────── BOOT ───────────────────────────── */
hydrateIcons();
loadPhotos();
renderChips();
renderLists();
renderTabs();

document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-chip]');
  if (b) { activeChip = b.dataset.chip; renderChips(); }
});

const segs = document.querySelectorAll('.seg');
requestAnimationFrame(() => moveSeg(segs[0]));
segs.forEach(b => b.addEventListener('click', () => moveSeg(b)));

const searchEl = document.getElementById('search'), clearEl = document.getElementById('clear');
searchEl.addEventListener('input', () => {
  query = searchEl.value;
  clearEl.classList.toggle('hidden', !query);
  renderLists();
});
clearEl.addEventListener('click', () => {
  searchEl.value = ''; query = ''; clearEl.classList.add('hidden'); renderLists();
});

/* shift + wheel scrolls the horizontal rails; plain wheel still scrolls the page */
['featured', 'popular', 'chips'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('wheel', e => {
    if (e.shiftKey && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });
});
</script>
</body>
</html>
